<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<!-- color-scheme: dark: trang này là trang TỐI (nền #141414) nhưng
     vẽ skin Winamp SÁNG (menubar RGB ~236, chữ đen). Chrome trên Android
     khi bật dark mode sẽ "force-dark" trang không khai báo scheme: nó đảo
     ngược ảnh sáng → menubar thành nền tối chữ sáng (vệt đen đo được trên
     ảnh điện thoại thật 2/11: RGB ~107), trong khi render desktop đúng.
     Khai báo dark = trang đã tự hỗ trợ dark → Chrome KHÔNG force-dark,
     skin vẽ đúng màu gốc. Đã kiểm chứng bằng headless Chrome + force-dark:
     có meta này thì menubar sáng (210,212,218) như bản thường. -->
<meta name="color-scheme" content="dark">
<title>Amp v10.32 — Winamp Modern (cửa sổ chính + ngăn kéo + playlist + AVS/Video)</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  /* màn hình CHỈ HIỆN GIAO DIỆN (skin Winamp): không tiêu đề,
     không dòng mô tả/version, không hàng nút HTML, không chữ hướng dẫn.
     Chỉ còn: cửa sổ skin (#stage) + banner đỏ chỉ hiện khi lỗi.
     Mọi mục menu (nạp skin / thêm nhạc / zoom / Video/Vis / MAKI)
     nằm TRONG menu của skin (menubar File/Play/Options/View/Help của
     skin Modern, nút O trên titlebar của skin Classic) — không còn nút
     ngoài giao diện (nút menu góc dưới-phải đã bỏ 04/11). */
  html,body{margin:0;padding:0;background:#141414;color:#ccc;font-family:Verdana,Arial,sans-serif;}
  /* body padding 0 — trước đây padding:8px đẩy toàn
     bộ stage sang phải 8px (trái hở, phải bị cắt: cửa sổ chính 354px
     tới x=362 trên viewport 360px; playlist 436px cắt 84px). Giờ các
     cửa sổ sát mép trái, cửa sổ chính vừa khít viewport 360px.
     Đợt 9.5 (lỗi 1): ẩn thanh cuộn ngang của #stage-wrap — thanh cuộn
     (xuất hiện vì stage 354px rộng hơn wrap 344px) chính là "lằn ngang"
     ở đáy ngăn kéo lúc trượt xuống: nó nằm ở đáy stage, hiện ra khi
     stage đổi cao (mở ngăn kéo) rồi mờ đi lúc nghỉ. Ẩn thanh cuộn nhưng
     vẫn giữ overflow-x:auto nên vẫn vuốt ngang được để xem playlist. */
  body{text-align:center;padding:0;}
  /* stage/wrap co giãn chiều cao MƯỢT (250ms ease, khớp
     DRAWER_ANIM_MS) để đáy stage bám đáy ngăn kéo lúc trượt ra/vào —
     không còn khoản nền đen #000 lộ ra dưới ngăn kéo trong lúc trượt
     (trước đây stage nhảy ngay lên 280px lúc mở, ngăn kéo trượt sau
     250ms nên lộ nền đen; lúc đóng stage giữ 280 suốt lúc trượt rồi
     mới thu lại). */
  #stage-wrap{display:block;text-align:left;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;transition:height 250ms ease, margin-top 250ms ease;}
  #stage-wrap::-webkit-scrollbar{display:none;}
  .stage{position:relative;margin:0 auto;overflow:hidden;background:#000;transform-origin:0 0;transition:height 250ms ease;}
  /* v10.9 (04/11 — Hải "vẫn còn viền xung quanh máy nghe nhạc"): BỎ box-shadow khỏi .stage
     (viền 1px #333 + bóng đổ quanh toàn bộ khung player); Winamp thật trên desktop không có
     khung này (cửa sổ nổi trên desktop). Chỉ gỡ ở .stage — #btn-reopen và #maki-panel giữ bóng. */
  .stage .spr{position:absolute;display:block;border:0;padding:0;background-repeat:no-repeat;
    image-rendering:auto;-webkit-user-drag:none;user-select:none;pointer-events:none;}
  .stage .btn{position:absolute;padding:0;border:0;background:transparent;cursor:default;pointer-events:auto;}
  .stage .btn .spr{position:absolute;left:0;top:0;pointer-events:none;}
  .stage .txt{position:absolute;overflow:hidden;white-space:nowrap;pointer-events:none;line-height:1;}
  .stage .txt .glyph{display:inline-block;vertical-align:top;background-repeat:no-repeat;}
  .stage .ticker{position:absolute;overflow:hidden;white-space:nowrap;pointer-events:none;}
  .stage .ticker .txt{will-change:transform;}
  .stage .vis{position:absolute;pointer-events:none;}
  .stage .rect{position:absolute;pointer-events:none;}
  .stage .pl-list{position:absolute;overflow-y:auto;overflow-x:hidden;font-family:Arial,sans-serif;pointer-events:auto;}
  .stage .pl-list .row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:13px;padding:0 3px;cursor:default;}
  .stage .pl-list .row.sel{background:#6788c9;color:#d6e4ff;}
  .stage .pl-list .row.cur{color:#bbd2ff;font-weight:bold;}
  /* Banner lỗi: ẩn mặc định, chỉ hiện khi lỗi thật (version lệch,
     không nạp được skin). Self-check KHÔNG còn banner trên màn hình
     (đợt 9.5: người dùng chốt bỏ — chỉ ghi console để debug).
     Không có chữ thường trực trên màn hình. */
  #status{display:none;margin:8px auto;max-width:720px;font-size:12px;color:#e88;min-height:16px;text-align:left;line-height:1.5;}
  #status.show{display:block;border:1px solid #a33;background:#2a1111;padding:6px 8px;}
  /* v9.6 (Điểm 2): nút mở lại khi bấm X ở cửa sổ chính — web không có
     "thoát app" như Winamp thật nên X ẩn giao diện, nút này hiện giữa
     màn hình để mở lại (không cần tải lại trang). Ẩn mặc định. */
  #btn-reopen{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:60;
    background:#ECE9D8;color:#000;border:1px solid #ACA899;border-radius:6px;
    padding:12px 22px;font-size:14px;cursor:pointer;font-family:Verdana,Arial,sans-serif;
    box-shadow:0 8px 30px rgba(0,0,0,.6);}
  #btn-reopen:hover{background:#316AC5;color:#fff;}
  /* ĐỢT 5 (03/11): cửa sổ chọn skin từ kho Webamp (#skin-panel +
     skin-browser.js) ĐÃ GỠ HẲN theo chốt của Hải — chạy trên mạng
     không nạp trực tiếp skin từ kho vào được mà phải tải về đưa lên
     nên cửa sổ đó vô dụng. Chỉ giữ "Nạp skin .wal/.wsz/.zip…" chọn file
     tay làm cách duy nhất để nạp skin. Quy tắc [hidden] còn lại cho
     #btn-reopen và #maki-panel. */
  #btn-reopen[hidden],#maki-panel[hidden]{display:none;}
  /* bảng xem MAKI — nền sáng như menu Winamp thật (#ECE9D8, chữ đen,
     hover #316AC5), giữa màn hình,
     cuộn trong khi cần; quy tắc [hidden] ở trên (đặt SAU display) để
     thuộc tính hidden thật sự ẩn panel (bài học panel chọn skin đợt 4). */
  #maki-panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:55;
    background:#ECE9D8;border:1px solid #ACA899;border-radius:6px;width:min(340px,100vw-24px);
    max-height:min(440px,100vh-120px);display:flex;flex-direction:column;
    box-shadow:0 8px 30px rgba(0,0,0,.6);text-align:left;color:#000;}
  #maki-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;
    font-size:13px;font-weight:bold;border-bottom:1px solid #ACA899;}
  #maki-close{background:none;border:0;font-size:14px;cursor:pointer;color:#000;padding:2px 6px;}
  #maki-body{overflow:auto;padding:8px 10px;font-size:12px;line-height:1.5;}
  #maki-body table{border-collapse:collapse;width:100%;font-size:11px;}
  #maki-body th,#maki-body td{border:1px solid #c9c4ae;padding:3px 5px;text-align:left;vertical-align:top;}
  #maki-body details{margin:6px 0;}
  #maki-body summary{cursor:pointer;font-weight:bold;}
  /* v10.3 — nhấp nháy đồng hồ Classic khi tạm dừng (fork main-window.css:
     .pause #time { animation: blink 2s step-start 1s infinite }). */
  @keyframes blink{0%{opacity:1;}50%{opacity:0;}100%{opacity:1;}}
</style>
</head>
<body>
<div id="stage-wrap"><div class="stage" id="stage"></div></div>
<div id="status"></div>
<button id="btn-reopen" hidden>Mở lại Amp</button>
<!-- bảng xem
     script MAKI của skin đang nạp — liệt kê file .maki + method ẩn/hiện.
     Chỉ hiện khi bấm mục "Xem script MAKI…" trong menu Help của skin;
     không thêm chrome thường trực (màn hình vẫn chỉ hiện skin khi đóng
     panel). Các mục cũ của nút menu góc dưới-phải (đã bỏ 04/11 — nạp
     skin / thêm nhạc / zoom /
     Crossfade / Milkdrop / Video/Vis — 18 mục) đã chuyển hết vào menu
     của skin (renderer.js: fileMenuItems / viewMenuItems /
     optionsMenuItems / helpMenuItems), nút menu đã bỏ 04/11. -->
<div id="maki-panel" hidden>
  <div id="maki-head"><span>Script MAKI (chỉ xem — không chạy)</span><button id="maki-close" title="Đóng" aria-label="Đóng">✕</button></div>
  <div id="maki-body">Chưa nạp.</div>
</div>
<input type="file" id="skinpick" accept=".wal,.zip,.wsz" hidden>

<script>
/* VERSION MANIFEST DUY NHẤT: "10.32" là nguồn sự thật, đặt TRƯỚC mọi
   file JS. 8 file (classic/skin-loader/audio/eqf/milkdrop/metadata/maki/
   renderer) đọc window.AMP_VERSION lúc nạp để tự kiểm
   (MANIFEST_MISMATCH); index.html kiểm lại ở checkVersions() và DỪNG +
   báo "bản mix" nếu lệch 1 file. Đổi version thì đổi CHỖ NÀY + 8 hằng
   version trong 8 file JS + ?v= trên 8 thẻ script.
   Thứ tự nạp có ý nghĩa: metadata.js nạp TRƯỚC renderer.js để renderer
   tiêm qua opts.metadata lúc tạo. Chọn skin từ kho (skin-browser.js)
   đã GỠ hẳn — chỉ còn "Nạp skin .wal/.wsz/.zip…" chọn file tay. */
window.AMP_VERSION = "10.32";
</script>
<script src="classic.js?v=10.32"></script>
<script src="skin-loader.js?v=10.32"></script>
<script src="audio.js?v=10.32"></script>
<script src="eqf.js?v=10.32"></script>
<!-- milkdrop.js: CHỈ nạp loader (file này). Thư viện butterchurn ĐÃ ĐÓNG
     GÓI LOCAL trong zip (butterchurn.min.js + butterchurnPresets.min.js,
     cùng thư mục): loader nạp ĐỘNG file local khi bật Milkdrop lần đầu
     (lazy), lỗi thì fallback CDN jsDelivr -> unpkg — xem các link ở ĐẦU
     milkdrop.js (BUTTERCHURN_LOCAL / BUTTERCHURN_CDN / BUTTERCHURN_UNPKG
     / PRESETS_* / DEFAULT_PRESET_URL). -->
<script src="milkdrop.js?v=10.32"></script>
<script src="metadata.js?v=10.32"></script>
<script src="maki.js?v=10.32"></script>
<script src="renderer.js?v=10.32"></script>
<script>
"use strict";
/* Amp v9 — vỏ trang (cửa sổ chính + ngăn kéo + playlist + AVS/Video + tiếng).
   VERSION = "10.32" ở mọi file; lệch version thì dừng và báo rõ, không vẽ
   sai trong im lặng (bài học bản mix v7.4/v8). Nguồn sự thật duy nhất là
   window.AMP_VERSION (đặt ở thẻ script ngay trước 8 file JS); mỗi file
   tự đối chiếu manifest lúc nạp (MANIFEST_MISMATCH) để file cũ trên
   host tự tố mình. */
/* BẮT BUỘC: bind rõ từng phần tử theo id ngay đầu script — không dựa vào
   biến global tự sinh từ id (id có gạch ngang không thành biến camelCase). */
var $ = function (s) { return document.querySelector(s); };
var stage = $("#stage"), stageWrap = $("#stage-wrap"), statusEl = $("#status"),
    btnReopen = $("#btn-reopen"),
    fileInput = $("#skinpick");

var VERSION = "10.32";
var zoom = "fit"; /* mặc định "fit" để thấy hết các góc (trước đây "1" làm playlist 436px bị cắt góc phải trên viewport 360px). */
var RES = null, SKIN = null, renderer = null, audioEngine = null;
/* crossfade + Milkdrop — chỉnh từ menu trong giao diện skin (File/
   Play/Options/View/Help của skin Modern, nút O của skin Classic),
   lưu localStorage.
   crossfadeMs: 0 = tắt, mặc định 2000 (2s); milkdropOn: mặc định BẬT
   (v10.8, theo yêu cầu của Hải 04/11 — mở cửa sổ AVS/Video là thấy
   hiệu ứng ngay, không cần bật tay; chưa mở cửa sổ thì vòng render
   không chạy nên không tốn CPU/GPU, chỉ giữ ~850KB thư viện
   butterchurn đã nạp lazy — xem milkdrop.js. Tắt được từ menu View /
   Vis / Video, lưu localStorage "amp9-milkdrop-v1" ("0" = tắt). */
var crossfadeMs = 2000;
var milkdropOn = true, milkdropCtl = null, milkdropLastErrorShown = "";
try { var _xf = parseInt(localStorage.getItem("amp9-xfade-ms") || "2000", 10); if (isFinite(_xf) && _xf >= 0 && _xf <= 10000) crossfadeMs = _xf; } catch (e) { /* bỏ qua */ }
try { milkdropOn = localStorage.getItem("amp9-milkdrop-v1") !== "0"; } catch (e) { milkdropOn = true; }
var drawerOpen = false; /* ngăn kéo mặc định đóng (chỉ lộ 3px dưới đáy main + nút mở) */
var shadeMode = false; /* shade mode mặc định tắt; khôi phục từ localStorage trước lần render đầu */
var playlistOpen = false; /* playlist mặc định đóng; mở bằng nút PL, menu View, nút Xếp chồng */
/* Media Library mặc định đóng; mở bằng nút ML trong
   skin, menu View, hoặc nút X trên titlebar ML để đóng. */
/* kích thước cửa sổ đã kéo (playlist/ML/video rời),
   lưu localStorage "amp9-winsize-v9", khôi phục khi nạp trang. */
var mlOpen = false;

/* màn hình CHỈ HIỆN GIAO DIỆN: không còn dòng version thường
   trực trên màn hình. Thông báo thường → console (im lặng trên màn
   hình); chỉ LỖI mới hiện banner đỏ #status (version lệch, không nạp
   được skin...). Self-check KHÔNG còn banner (đợt 9.5: bỏ theo yêu cầu
   người dùng) — chỉ ghi console để debug. */
function setStatus(msg, isErr) {
  if (isErr) {
    statusEl.textContent = msg;
    statusEl.classList.add("show");
  } else if (window.console && console.info) {
    console.info("[Amp] " + msg);
  }
}
/* Version chỉ ghi vào console + tiêu đề tab (không hiện ra màn hình).
   Đúng version thì im lặng; lệch thì checkVersions() báo đỏ qua
   setStatus(..., true) và dừng boot. */
function logVersion(extra) {
  var line = "Amp v10.32 · loader v" + (window.AmpSkinLoader ? window.AmpSkinLoader.LOADER_VERSION : "?")
    + " · audio v" + (window.AmpAudio ? window.AmpAudio.AUDIO_VERSION : "?")
    + " · renderer v" + (window.AmpRenderer ? window.AmpRenderer.RENDERER_VERSION : "?")
    + " · eqf v" + (window.AmpEqf ? window.AmpEqf.EQF_VERSION : "?")
    + " · classic v" + (window.AmpClassic ? window.AmpClassic.CLASSIC_VERSION : "?")
    + " · milkdrop v" + (window.AmpMilkdrop ? window.AmpMilkdrop.MILKDROP_VERSION : "?")
    + " · metadata v" + (window.AmpMetadata ? window.AmpMetadata.METADATA_VERSION : "?")
    + " · maki v" + (window.AmpMaki ? window.AmpMaki.MAKI_VERSION : "?")
    + " · model fromCache: " + (RES ? String(RES.fromCache) : "?") + (extra ? " · " + extra : "");
  if (window.console && console.info) console.info("[Amp] " + line);
  try { document.title = "Amp v10.32 — Winamp Modern"; } catch (e) { /* bỏ qua */ }
}
function checkVersions() {
  var bad = [];
  if (!window.AmpClassic || window.AmpClassic.CLASSIC_VERSION !== VERSION) bad.push("classic.js v" + (window.AmpClassic ? window.AmpClassic.CLASSIC_VERSION : "?"));
  if (!window.AmpSkinLoader || window.AmpSkinLoader.LOADER_VERSION !== VERSION) bad.push("skin-loader.js v" + (window.AmpSkinLoader ? window.AmpSkinLoader.LOADER_VERSION : "?"));
  if (!window.AmpAudio || window.AmpAudio.AUDIO_VERSION !== VERSION) bad.push("audio.js v" + (window.AmpAudio ? window.AmpAudio.AUDIO_VERSION : "?"));
  if (!window.AmpRenderer || window.AmpRenderer.RENDERER_VERSION !== VERSION) bad.push("renderer.js v" + (window.AmpRenderer ? window.AmpRenderer.RENDERER_VERSION : "?"));
  if (!window.AmpEqf || window.AmpEqf.EQF_VERSION !== VERSION) bad.push("eqf.js v" + (window.AmpEqf ? window.AmpEqf.EQF_VERSION : "?"));
  if (!window.AmpMilkdrop || window.AmpMilkdrop.MILKDROP_VERSION !== VERSION) bad.push("milkdrop.js v" + (window.AmpMilkdrop ? window.AmpMilkdrop.MILKDROP_VERSION : "?"));
  if (!window.AmpMetadata || window.AmpMetadata.METADATA_VERSION !== VERSION) bad.push("metadata.js v" + (window.AmpMetadata ? window.AmpMetadata.METADATA_VERSION : "?"));
  if (!window.AmpMaki || window.AmpMaki.MAKI_VERSION !== VERSION) bad.push("maki.js v" + (window.AmpMaki ? window.AmpMaki.MAKI_VERSION : "?"));
  if (window.AmpSkinLoader && window.AmpSkinLoader.LOADER_VERSION !== window.AmpSkinLoader.EXPECTED_LOADER_VERSION) bad.push("loader lệch EXPECTED_LOADER_VERSION");
  /* mỗi file tự đối chiếu với manifest lúc nạp (MANIFEST_MISMATCH):
     file cũ trên host/cache sẽ tự tố mình dù hằng VERSION trong trang đã mới. */
  if (window.AmpSkinLoader && window.AmpSkinLoader.MANIFEST_MISMATCH) bad.push("skin-loader.js v" + window.AmpSkinLoader.LOADER_VERSION + " (manifest v" + VERSION + ")");
  if (window.AmpAudio && window.AmpAudio.MANIFEST_MISMATCH) bad.push("audio.js v" + window.AmpAudio.AUDIO_VERSION + " (manifest v" + VERSION + ")");
  if (window.AmpRenderer && window.AmpRenderer.MANIFEST_MISMATCH) bad.push("renderer.js v" + window.AmpRenderer.RENDERER_VERSION + " (manifest v" + VERSION + ")");
  if (window.AmpEqf && window.AmpEqf.MANIFEST_MISMATCH) bad.push("eqf.js v" + window.AmpEqf.EQF_VERSION + " (manifest v" + VERSION + ")");
  if (window.AmpClassic && window.AmpClassic.MANIFEST_MISMATCH) bad.push("classic.js v" + window.AmpClassic.CLASSIC_VERSION + " (manifest v" + VERSION + ")");
  if (window.AmpMilkdrop && window.AmpMilkdrop.MANIFEST_MISMATCH) bad.push("milkdrop.js v" + window.AmpMilkdrop.MILKDROP_VERSION + " (manifest v" + VERSION + ")");
  if (window.AmpMetadata && window.AmpMetadata.MANIFEST_MISMATCH) bad.push("metadata.js v" + window.AmpMetadata.METADATA_VERSION + " (manifest v" + VERSION + ")");
  if (window.AmpMaki && window.AmpMaki.MANIFEST_MISMATCH) bad.push("maki.js v" + window.AmpMaki.MAKI_VERSION + " (manifest v" + VERSION + ")");
  if (bad.length) {
    setStatus("BẢN MIX — version lệch, dừng lại: " + bad.join(" + ") + " (cần v" + VERSION + " ở mọi file)", true);
    return false;
  }
  return true;
}
/* lưu state phát (playing/current/repeat/shuffle/volume/EQ) vào
   localStorage, debounce 300ms vì kéo slider gọi liên tục. */
var savePlayTimer = 0;
function savePlaybackState(st) {
  if (savePlayTimer) clearTimeout(savePlayTimer);
  savePlayTimer = setTimeout(function () {
    savePlayTimer = 0;
    try { localStorage.setItem("amp9-play-v9", JSON.stringify(st)); } catch (e) { /* private mode */ }
  }, 300);
}
function loadPlaybackState() {
  try {
    var s = JSON.parse(localStorage.getItem("amp9-play-v9") || "null");
    return s && typeof s === "object" ? s : null;
  } catch (e) { return null; }
}
function ensureJSZip() {
  return new Promise(function (resolve, reject) {
    if (window.JSZip) return resolve(window.JSZip);
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = function () { window.JSZip ? resolve(window.JSZip) : reject(new Error("không tải được JSZip")); };
    s.onerror = function () { reject(new Error("không tải được JSZip (cần mạng)")); };
    document.head.appendChild(s);

        + ea.videoRect.w + "×" + ea.videoRect.h + " tại (" + ea.videoRect.x + "," + ea.videoRect.y + ")");
    } else {
      lines.push("AVS nhúng (embeddedAvs): không" + (RES.kind === "classic" ? " (skin Classic .wsz — chỉ cửa sổ Video/Hiệu ứng rời)" : " — chỉ cửa sổ rời"));
    }
    var avsNow = renderer.getAvsState();
    lines.push("AVS hiện tại: " + (avsNow.open ? ("mở, chế độ " + avsNow.mode + (avsNow.detached ? ", cửa sổ rời" : ", vùng nhúng") + ", scale " + avsNow.videoScale + "x") : "đóng"));
    lines.push(playlistInfo);
    if (loaded.report.notes.length) lines.push("Ghi chú: " + loaded.report.notes.join(" | "));
    /* v10.12 (P1 F): file thiếu trong .wal — ghi rõ là file .wal thiếu,
       không phải lỗi Amp (vd CROSSNET thiếu 8 ảnh, Braun thiếu 8 XML). */
    if (loaded.report.missing.length) lines.push("File thiếu trong .wal (" + loaded.report.missing.length + "): " + loaded.report.missing.join(" | "));
    /* Thông tin skin chỉ ghi console (màn hình chỉ hiện giao diện). */
    if (window.console && console.info) console.info("[Amp]\n" + lines.join("\n"));
    logVersion("skin: " + (SKIN.name || name));
    setZoom(zoom);
    /* khôi phục Milkdrop đã bật ở lần trước (nạp lib lazy).
       Đợt v10.2 — AUDIT: trước đây gọi toggleMilkdrop() khi milkdropOn=true
       thì TẮT luôn Milkdrop sau mỗi lần đổi skin (toggle đảo trạng thái),
       trái ý "khôi phục". Sửa: tắt → reset visualizer (nó giữ ctx/analyser
       của engine cũ) → bật lại với canvas/ctx mới. */
    if (milkdropOn) {
      (async function () {
        try { await toggleMilkdrop(); } catch (e) { /* bỏ qua */ }
        try { if (milkdropCtl && milkdropCtl.reset) milkdropCtl.reset(); } catch (e) { /* bỏ qua */ }
        try { await toggleMilkdrop(); } catch (e) { /* bỏ qua */ }
      })();
    }
    if (RES.kind === "classic") {
      var cs = renderer.getClassicMainState ? renderer.getClassicMainState() : null;
      setStatus("Đã nạp skin Classic " + (SKIN.name || name) + " — cửa sổ chính Classic "
        + (cs ? cs.w + "×" + cs.h + " (" + cs.sheets.length + " sheet BMP)" : "đã vẽ")
        + "; nút EQ mở/đóng ngăn kéo, nút PL đổi trạng thái playlist (cửa sổ Playlist/EQ Classic riêng chưa vẽ — đợt sau). Kênh TV (Đà Nẵng…) chỉ xem được khi EQ TẮT.");
    } else {
      setStatus("Đã nạp: " + (SKIN.name || name) + " — ngăn kéo mở bằng nút trong skin / menu View; nút PL (hoặc menu View) mở Playlist; nhấp đúp kênh để phát (Space = Play/Pause; thêm phím tắt ở menu Help → Hướng dẫn nhanh). Kênh TV (Đà Nẵng…) chỉ xem được khi EQ TẮT — bật EQ thì crossOrigin=anonymous, server không có CORS nên không nạp được (như Webamp fork).");
    }
  } catch (e) {
    /* khôi phục skin cũ đang chạy (nếu có). Chưa từng nạp skin nào
       thành công thì không có gì để khôi phục, chỉ báo lỗi như trước. */
    if (prevSkin.renderer) {
      RES = prevSkin.RES; SKIN = prevSkin.SKIN; renderer = prevSkin.renderer;
      audioEngine = prevSkin.audioEngine; shadeMode = prevSkin.shadeMode;
      /* KHÔNG đụng stage.innerHTML: render nguyên tử (build rồi swapIn)
         nên khi render lỗi stage thật chưa hề bị chạm — DOM cũ còn nguyên
         kèm registry/handler của renderer cũ. Ghi đè innerHTML bằng chuỗi
         sẽ phá hết handler onclick + registry trỏ vào node cũ. Chỉ cần
         trả lại biến model/renderer + tính lại zoom theo stage cũ. */
      setZoom(zoom);
      setStatus("Lỗi: " + (e.message || e) + " — skin này không dùng được, vẫn giữ skin '" + (prevSkin.SKIN && prevSkin.SKIN.name ? prevSkin.SKIN.name : "cũ") + "'.", true);
    } else {
      setStatus("Lỗi: " + (e.message || e), true);
    }
  }
}
/* Nối trang (không còn nút menu ngoài skin — bỏ 04/11): các mục cũ của
   nút đó (nạp skin / thêm nhạc / zoom / Crossfade / Milkdrop / Video-Vis
   / MAKI — đủ 18 mục) nay nằm TRONG menu của skin (renderer.js:
   fileMenuItems / viewMenuItems / optionsMenuItems / helpMenuItems;
   skin Classic thì gộp vào menu của nút O trên titlebar). Chỗ này chỉ
   còn: nút "Mở lại Amp", đóng bảng MAKI, phím tắt, hộp chọn file skin,
   resize, kéo-thả file .wal/.wsz/.zip vào trang (không chữ hướng dẫn). */
function wirePage() {
  /* v9.6 (Điểm 2): nút "Mở lại Amp" — hiện lại giao diện sau khi bấm X
     ở cửa sổ chính (onPlayerClose đã ẩn stage-wrap). */
  if (btnReopen) btnReopen.addEventListener("click", function () {
    try { stageWrap.style.display = ""; } catch (e) { /* bỏ qua */ }
    try { btnReopen.hidden = true; } catch (e) { /* bỏ qua */ }
    try { renderCurrent(); } catch (e) { /* bỏ qua */ }
  });
  /* đóng bảng MAKI: nút ✕, chạm ngoài panel, phím Esc.
     Bỏ qua cú chạm mở panel trong 250ms (cú chạm mở nổi bọt lên document
     SAU khi open() chạy — bài học panel chọn skin đợt 4). */
  var makiCloseBtn = document.getElementById("maki-close");
  if (makiCloseBtn) makiCloseBtn.addEventListener("click", function (e) {
    if (e.stopPropagation) e.stopPropagation();
    closeMakiPanel();
  });
  document.addEventListener("click", function (e) {
    if (!makiPanel || makiPanel.hidden) return;
    if (Date.now() - makiOpenedAt < 250) return;
    if (makiPanel.contains && makiPanel.contains(e.target)) return;
    closeMakiPanel();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeMakiPanel();
  });
  /* phím tắt: renderer.handleHotkey nhận mọi phím
     (Space, mũi tên, N/P, M, L, S, X/C/V…), tự bỏ qua khi focus trong
     ô nhập hoặc bấm kèm Ctrl/Alt/Meta, tự preventDefault khi đã xử lý.
     Đăng ký 1 lần ở đây (như phím Space đợt E) để đổi skin không đăng
     ký trùng — handler đọc biến renderer hiện tại. */
  document.addEventListener("keydown", function (e) {
    if (!renderer || !renderer.handleHotkey) return;
    try { renderer.handleHotkey(e); } catch (err) { /* phím tắt lỗi thì thôi, không vỡ trang */ }
  });
  fileInput.addEventListener("change", function () {
    if (fileInput.files.length) bootSkin(fileInput.files[0], fileInput.files[0].name);
  });
  window.addEventListener("resize", function () { if (zoom === "fit") setZoom("fit"); });
  /* Kéo-thả file .wal/.wsz/.zip vào trang (giữ nguyên, không chữ hướng dẫn). */
  ["dragover", "dragenter", "dragleave", "drop"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); });
  });
  document.addEventListener("drop", function (e) {
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) bootSkin(f, f.name);
  });
}
wirePage();
/* bảng "Xem script MAKI…": CHỈ XEM, không
   chạy code MAKI. Đọc file .maki của skin đang nạp từ zip (RES.zip do
   loader giữ), parse + inspect bằng window.AmpMaki rồi vẽ bảng tóm tắt:
   mỗi file 1 dòng (lệnh/call/binding/ẩn-hiện/gán text) + <details> mở
   rộng xem binding, method gọi nhiều, 20 sự kiện ẩn/hiện đầu. Skin
   Classic (.wsz) thường không có .maki thì báo rõ "không có file .maki".
   Panel đóng bằng nút ✕ / chạm ngoài / Esc (quy tắc [hidden] đã sửa
   theo bài học panel chọn skin đợt 4 — CSS #maki-panel[hidden] đặt sau
   display nên hidden thật sự ẩn panel). */
var makiPanel = null, makiBody = null, makiOpenedAt = 0;
function makiPanelEls() {
  if (!makiPanel) makiPanel = document.getElementById("maki-panel");
  if (!makiBody) makiBody = document.getElementById("maki-body");
  return !!(makiPanel && makiBody);
}
function closeMakiPanel() { if (makiPanel) makiPanel.hidden = true; }
function makiTextEl(tag, text) {
  var el = document.createElement(tag);
  el.textContent = text;
  return el;
}
async function openMakiPanel() {
  if (!makiPanelEls()) { setStatus("Không tìm thấy bảng MAKI.", true); return; }
  makiPanel.hidden = false;
  makiOpenedAt = Date.now();
  makiBody.textContent = "Đang đọc script MAKI…";
  if (!window.AmpMaki) { makiBody.textContent = "Không nạp được maki.js."; return; }
  var zip = (RES && RES.zip) ? RES.zip : null;
  if (!zip) { makiBody.textContent = "Skin đang nạp không giữ file zip (không đọc được .maki)."; return; }
  var names = Object.keys(zip.files || {}).filter(function (n) { return /\.maki$/i.test(n) && !(zip.files[n] && zip.files[n].dir); }).sort();
  if (!names.length) { makiBody.textContent = "Skin này không có file .maki (skin Classic .wsz thường không có script MAKI)."; return; }
  try {
    var files = [];
    for (var i = 0; i < names.length; i++) {
      var data = await zip.files[names[i]].async("uint8array");
      files.push({ name: names[i].split("/").pop(), data: data });
    }
    var skin = window.AmpMaki.inspectSkinFiles(files);
    while (makiBody.firstChild) makiBody.removeChild(makiBody.firstChild);
    var t = skin.totals;
    makiBody.appendChild(makiTextEl("div", "Skin " + (SKIN && SKIN.name ? SKIN.name : "") + ": " + t.files + " file .maki · "
      + t.commands + " lệnh · " + t.calls + " call · " + t.bindings + " binding · "
      + t.visibility + " ẩn/hiện · " + t.textSets + " gán text"
      + (t.errors ? " · LỖI " + t.errors + " file" : "")
      + (t.unknownArity ? " · " + t.unknownArity + " call không rõ số đối số" : "")));
    makiBody.appendChild(makiTextEl("div", "Chỉ xem — không chạy code MAKI. Báo cáo đầy đủ: maki-566-report.md (skin 566)."));
    var table = document.createElement("table");
    var head = document.createElement("tr");
    ["File", "Call", "Binding", "Ẩn/hiện", "Gán text"].forEach(function (h) { head.appendChild(makiTextEl("th", h)); });
    table.appendChild(head);
    skin.results.forEach(function (r) {
      var tr = document.createElement("tr");
      if (r.error) {
        tr.appendChild(makiTextEl("td", r.name + " — LỖI: " + r.error));
        ["", "", "", ""].forEach(function () { tr.appendChild(makiTextEl("td", "")); });
      } else {
        var s = r.inspect.stats;
        tr.appendChild(makiTextEl("td", r.name));
        tr.appendChild(makiTextEl("td", String(s.calls)));
        tr.appendChild(makiTextEl("td", String(s.bindings)));
        tr.appendChild(makiTextEl("td", String(r.inspect.visibility.length)));
        tr.appendChild(makiTextEl("td", String(r.inspect.textSets.length)));
      }
      table.appendChild(tr);
    });
    makiBody.appendChild(table);
    skin.results.forEach(function (r) {
      if (r.error || !r.inspect) return;
      var det = document.createElement("details");
      det.appendChild(makiTextEl("summary", r.name + " — chi tiết"));
      det.appendChild(makiTextEl("div", "Binding: " + r.inspect.bindings.map(function (b) {
        return b.method + (b.variableDesc ? " trên " + b.variableDesc : " (var#" + b.variableOffset + ")");
      }).join(", ")));
      var top = Object.keys(r.inspect.callsByMethod).map(function (k) { return [k, r.inspect.callsByMethod[k]]; })
        .sort(function (a, b) { return b[1] - a[1]; }).slice(0, 8);
      det.appendChild(makiTextEl("div", "Method gọi nhiều: " + top.map(function (kv) { return kv[0] + "×" + kv[1]; }).join(", ")));
      r.inspect.visibility.slice(0, 20).forEach(function (e) {
        det.appendChild(makiTextEl("div", e.className + "." + e.method + " → " + e.target + (e.args.length ? " (" + e.args.join(", ") + ")" : "")));
      });
      if (r.inspect.visibility.length > 20) det.appendChild(makiTextEl("div", "…còn " + (r.inspect.visibility.length - 20) + " sự kiện ẩn/hiện nữa (xem báo cáo .md)."));
      makiBody.appendChild(det);
    });
  } catch (e) {
    makiBody.textContent = "Không đọc được script MAKI: " + (e && e.message ? e.message : e);
  }
}
/* openSkinBrowser + panel #skin-panel đã gỡ hẳn (xem
   ghi chú manifest trên) — nạp skin chỉ còn file tay (menu File của
   skin "Nạp skin .wal/.wsz/.zip…", kéo-thả, hoặc bootSkin mặc định 566).
   Panel MAKI ở trên (#maki-panel) là panel XEM script, không phải panel
   chọn skin — đừng nhầm 2 panel này. */
if (checkVersions()) {
  logVersion("");
  (async function () {
    try {
      var r = await fetch("winampmodern566.wal");
      if (r.ok) {
        var buf = await r.arrayBuffer();
        await bootSkin(buf, "winampmodern566.wal");
        return;
      }
    } catch (e) { /* không có file cùng thư mục -> chờ kéo thả */ }
    setStatus("Chưa thấy file winampmodern566.wal cùng thư mục — kéo thả file .wal/.wsz/.zip vào trang, hoặc mở menu File trong skin → “Nạp skin .wal/.wsz/.zip…”.", true);
  })();
} else {
  setStatus("Version lệch — dừng lại, xem banner đỏ ở trên.", true);
}
</script>
</body>

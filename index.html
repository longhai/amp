<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<!-- Đợt G — color-scheme: dark: trang này là trang TỐI (nền #141414) nhưng
     vẽ skin Winamp SÁNG (menubar RGB ~236, chữ đen). Chrome trên Android
     khi bật dark mode sẽ "force-dark" trang không khai báo scheme: nó đảo
     ngược ảnh sáng → menubar thành nền tối chữ sáng (vệt đen đo được trên
     ảnh điện thoại thật 2/11: RGB ~107), trong khi render desktop đúng.
     Khai báo dark = trang đã tự hỗ trợ dark → Chrome KHÔNG force-dark,
     skin vẽ đúng màu gốc. Đã kiểm chứng bằng headless Chrome + force-dark:
     có meta này thì menubar sáng (210,212,218) như bản thường. -->
<meta name="color-scheme" content="dark">
<title>Amp v10.2 — Winamp Modern (cửa sổ chính + ngăn kéo + playlist + AVS/Video)</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  /* Đợt G — màn hình CHỈ HIỆN GIAO DIỆN (skin Winamp): không tiêu đề,
     không dòng mô tả/version, không hàng nút HTML, không chữ hướng dẫn.
     Chỉ còn: cửa sổ skin (#stage) + 1 nút menu nhỏ ⋯ ở góc dưới-phải
     (nạp skin / thêm nhạc / zoom) + banner đỏ chỉ hiện khi lỗi. */
  html,body{margin:0;padding:0;background:#141414;color:#ccc;font-family:Verdana,Arial,sans-serif;}
  /* Đợt 9.5 (lỗi 3+4): body padding 0 — trước đây padding:8px đẩy toàn
     bộ stage sang phải 8px (trái hở, phải bị cắt: cửa sổ chính 354px
     tới x=362 trên viewport 360px; playlist 436px cắt 84px). Giờ các
     cửa sổ sát mép trái, cửa sổ chính vừa khít viewport 360px.
     Đợt 9.5 (lỗi 1): ẩn thanh cuộn ngang của #stage-wrap — thanh cuộn
     (xuất hiện vì stage 354px rộng hơn wrap 344px) chính là "lằn ngang"
     ở đáy ngăn kéo lúc trượt xuống: nó nằm ở đáy stage, hiện ra khi
     stage đổi cao (mở ngăn kéo) rồi mờ đi lúc nghỉ. Ẩn thanh cuộn nhưng
     vẫn giữ overflow-x:auto nên vẫn vuốt ngang được để xem playlist. */
  body{text-align:center;padding:0;}
  /* Đợt 9.5 (lỗi 6): stage/wrap co giãn chiều cao MƯỢT (250ms ease, khớp
     DRAWER_ANIM_MS) để đáy stage bám đáy ngăn kéo lúc trượt ra/vào —
     không còn khoản nền đen #000 lộ ra dưới ngăn kéo trong lúc trượt
     (trước đây stage nhảy ngay lên 280px lúc mở, ngăn kéo trượt sau
     250ms nên lộ nền đen; lúc đóng stage giữ 280 suốt lúc trượt rồi
     mới thu lại). */
  #stage-wrap{display:block;text-align:left;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;transition:height 250ms ease, margin-top 250ms ease;}
  #stage-wrap::-webkit-scrollbar{display:none;}
  .stage{position:relative;margin:0 auto;overflow:hidden;background:#000;transform-origin:0 0;transition:height 250ms ease;
    box-shadow:0 0 0 1px #333, 0 8px 30px rgba(0,0,0,.6);}
  .stage .spr{position:absolute;display:block;border:0;padding:0;background-repeat:no-repeat;
    image-rendering:auto;-webkit-user-drag:none;user-select:none;pointer-events:none;}
  .stage .btn{position:absolute;padding:0;border:0;background:transparent;cursor:default;pointer-events:auto;}
  .stage .btn .spr{position:absolute;left:0;top:0;pointer-events:none;}
  .stage .txt{position:absolute;overflow:hidden;white-space:nowrap;pointer-events:none;line-height:1;}
  .stage .txt .glyph{display:inline-block;vertical-align:top;background-repeat:no-repeat;}
  .stage .ticker{position:absolute;overflow:hidden;white-space:nowrap;pointer-events:none;}
  .stage .ticker .inner{display:inline-block;white-space:nowrap;will-change:transform;}
  .stage .vis{position:absolute;pointer-events:none;}
  .stage .rect{position:absolute;pointer-events:none;}
  .stage .pl-list{position:absolute;overflow-y:auto;overflow-x:hidden;font-family:Arial,sans-serif;pointer-events:auto;}
  .stage .pl-list .row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:13px;padding:0 3px;cursor:default;}
  .stage .pl-list .row.sel{background:#6788c9;color:#d6e4ff;}
  .stage .pl-list .row.cur{color:#bbd2ff;font-weight:bold;}
  /* Banner lỗi: ẩn mặc định, chỉ hiện khi lỗi thật (version lệch,
     không nạp được skin). Self-check KHÔNG còn banner trên màn hình
     (đợt 9.5: người dùng chốt bỏ — chỉ ghi console để debug).
     Không có chữ thường trực trên màn hình. */
  #status{display:none;margin:8px auto;max-width:720px;font-size:12px;color:#e88;min-height:16px;text-align:left;line-height:1.5;}
  #status.show{display:block;border:1px solid #a33;background:#2a1111;padding:6px 8px;}
  /* Nút menu tối thiểu (⋯) ở góc dưới-phải: điểm chạm duy nhất ngoài
     skin — nạp skin .wal/.zip, thêm nhạc local, đổi zoom 1x/fit. Nhỏ,
     mờ, không thành hàng nút; bấm được trên điện thoại (36×36). */
  #btn-menu{position:fixed;right:10px;bottom:10px;z-index:50;width:36px;height:36px;
    border-radius:50%;background:rgba(236,233,216,.92);color:#000;border:1px solid #ACA899;
    font-size:18px;line-height:1;cursor:pointer;opacity:.85;padding:0;}
  #btn-menu:hover,#btn-menu:focus{opacity:1;border-color:#7a7663;color:#000;outline:none;}
  /* v9.6 (Điểm 5): menu ⋯ nền SÁNG như menu Winamp thật (#ECE9D8, chữ
     đen, hover #316AC5) — nền tối #1c1c1c cũ chìm vào nền trang #141414. */
  #menu-pop{position:fixed;right:10px;bottom:54px;z-index:50;background:#ECE9D8;
    border:1px solid #ACA899;border-radius:6px;padding:4px;min-width:200px;
    box-shadow:0 8px 30px rgba(0,0,0,.6);text-align:left;}
  #menu-pop button{display:block;width:100%;text-align:left;background:none;border:0;
    color:#000;padding:9px 10px;font-size:13px;cursor:pointer;border-radius:4px;font-family:Verdana,Arial,sans-serif;}
  #menu-pop button:hover{background:#316AC5;color:#fff;}
  #menu-pop button.on{color:#000;}
  #menu-pop button.on::before{content:"✓ ";}
  /* v9.6 (Điểm 2): nút mở lại khi bấm X ở cửa sổ chính — web không có
     "thoát app" như Winamp thật nên X ẩn giao diện, nút này hiện giữa
     màn hình để mở lại (không cần tải lại trang). Ẩn mặc định. */
  #btn-reopen{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:60;
    background:#ECE9D8;color:#000;border:1px solid #ACA899;border-radius:6px;
    padding:12px 22px;font-size:14px;cursor:pointer;font-family:Verdana,Arial,sans-serif;
    box-shadow:0 8px 30px rgba(0,0,0,.6);}
  #btn-reopen:hover{background:#316AC5;color:#fff;}
  /* ĐỢT 5 (03/11): cửa sổ chọn skin từ kho Webamp (#skin-panel +
     skin-browser.js) ĐÃ GỠ HẲN theo chốt của Hải — chạy trên mạng
     không nạp trực tiếp skin từ kho vào được mà phải tải về đưa lên
     nên cửa sổ đó vô dụng. Chỉ giữ "Nạp skin .wal/.zip…" chọn file
     tay làm cách duy nhất để nạp skin. Quy tắc [hidden] còn lại cho
     #menu-pop và #btn-reopen. */
  #menu-pop[hidden],#btn-reopen[hidden],#maki-panel[hidden]{display:none;}
  /* Đợt 7 (03/11): bảng xem MAKI — nền sáng như menu ⋯, giữa màn hình,
     cuộn trong khi cần; quy tắc [hidden] ở trên (đặt SAU display) để
     thuộc tính hidden thật sự ẩn panel (bài học panel chọn skin đợt 4). */
  #maki-panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:55;
    background:#ECE9D8;border:1px solid #ACA899;border-radius:6px;width:min(340px,100vw-24px);
    max-height:min(440px,100vh-120px);display:flex;flex-direction:column;
    box-shadow:0 8px 30px rgba(0,0,0,.6);text-align:left;color:#000;}
  #maki-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;
    font-size:13px;font-weight:bold;border-bottom:1px solid #ACA899;}
  #maki-close{background:none;border:0;font-size:14px;cursor:pointer;color:#000;padding:2px 6px;}
  #maki-body{overflow:auto;padding:8px 10px;font-size:12px;line-height:1.5;}
  #maki-body table{border-collapse:collapse;width:100%;font-size:11px;}
  #maki-body th,#maki-body td{border:1px solid #c9c4ae;padding:3px 5px;text-align:left;vertical-align:top;}
  #maki-body details{margin:6px 0;}
  #maki-body summary{cursor:pointer;font-weight:bold;}
</style>
</head>
<body>
<div id="stage-wrap"><div class="stage" id="stage"></div></div>
<div id="status"></div>
<button id="btn-reopen" hidden>Mở lại Amp</button>
<button id="btn-menu" title="Menu: nạp skin, thêm nhạc, zoom" aria-label="Menu">⋯</button>
<div id="menu-pop" hidden>
  <button data-act="skin">Nạp skin .wal/.zip…</button>
  <button data-act="localfile">Thêm 1 bài nhạc…</button>
  <button data-act="localdir">Thêm thư mục nhạc…</button>
  <button data-act="zoom1">Zoom: Cỡ gốc 1x</button>
  <button data-act="zoomfit">Zoom: Vừa màn hình</button>
  <button data-act="xfade">Crossfade: 2s</button>
  <button data-act="milkdrop">Milkdrop: Tắt</button>
  <button data-act="maki">Xem script MAKI…</button>
</div>
<!-- Đợt 7 (03/11, giai đoạn a: chỉ ĐỌC/inspect MAKI, không chạy): bảng xem
     script MAKI của skin đang nạp — liệt kê file .maki + method ẩn/hiện.
     Chỉ hiện khi bấm mục "Xem script MAKI…" trong menu ⋯; không thêm
     chrome thường trực (màn hình vẫn chỉ hiện skin khi đóng panel). -->
<div id="maki-panel" hidden>
  <div id="maki-head"><span>Script MAKI (chỉ xem — không chạy)</span><button id="maki-close" title="Đóng" aria-label="Đóng">✕</button></div>
  <div id="maki-body">Chưa nạp.</div>
</div>
<input type="file" id="skinpick" accept=".wal,.zip" hidden>

<script>
/* Đợt F — VERSION MANIFEST DUY NHẤT: "10.2" là nguồn sự thật, đặt TRƯỚC
   mọi file JS. skin-loader.js / audio.js / renderer.js / eqf.js /
   classic.js / milkdrop.js / metadata.js đọc window.AMP_VERSION lúc nạp để tự
   kiểm (MANIFEST_MISMATCH); index.html kiểm lại ở checkVersions() và
   DỪNG + báo "bản mix" nếu lệch 1 file.
   Đổi version thì đổi CHỖ NÀY + 8 hằng version trong 8 file JS + ?v=
   trên 8 thẻ script.
   Đợt 4 (03/11): thêm milkdrop.js (Milkdrop/butterchurn, file thứ 7) —
   Đợt 5 (03/11): thêm metadata.js (đọc tag nhạc local, file thứ 8) —
   nạp TRƯỚC renderer.js để renderer tiêm qua opts.metadata /
   window.AmpMetadata lúc tạo (như eqf.js); lib music-metadata chỉ
   nạp lười qua dynamic import() khi thêm file nhạc lần đầu.
   Đợt 5 (03/11, GỠ chọn skin từ kho): BỎ LUÔN skin-browser.js +
   panel #skin-panel + mục menu "Chọn skin từ kho…" theo chốt của Hải
   (chạy trên mạng không nạp trực tiếp skin từ kho vào được mà phải
   tải về đưa lên nên cửa sổ đó vô dụng; lúc test danh sách trong
   panel cũng đang trống). Chỉ giữ "Nạp skin .wal/.zip…" chọn file
   tay làm cách duy nhất để nạp skin. Số file JS còn 8 (đúng số
   hằng version ở trên).
   Đợt 6 (03/11: Media Session API + hotkeys — lấy từ mediaSession.ts /
   hotkeys.ts của fork, gỡ khỏi Redux, nối vào renderer.js): KHÔNG thêm
   file JS mới, không đổi loader → GIỮ "10.1". Listener phím tắt cũ
   (chỉ Space, đợt E) thay bằng delegate sang renderer.handleHotkey.
   KHÔNG đổi loader nên GIỮ "10.1".
   Đợt 7 (03/11, giai đoạn a: MAKI parser — chỉ ĐỌC/inspect, không chạy):
   thêm maki.js (MAKI_VERSION 10.1, port parser.ts/MakiFile.ts/constants.ts
   + bảng GUID/arity từ objectData của fork) + mục menu ⋯ "Xem script
   MAKI…" + panel #maki-panel (chỉ xem, không chạy). KHÔNG đổi loader →
   GIỮ "10.1". Số file JS nay là 8. Giai đoạn b (interpreter thật nối vào
   renderer) để sau — xem README mục Đợt 7.
   Đợt v10.1 (việc 3: Classic skin parser — CÓ đổi loader nên bump
   10.0 → 10.1): loader parse thật skin Classic (.wsz) bằng classic.js
   mới (chuyển từ parser của Webamp fork: viscolor/pledit/region/genex
   + bảng tọa độ sprite + hình học cửa sổ chính 275×116); renderer vẽ
   được cửa sổ chính Classic + shade 275×14, nút bấm được (transport/
   seek/volume/balance/EQ/PL/shade/minimize/close/clutter/about).
   Đợt v10.0: 9.9 → 10.0 (tích hợp Webamp fork đợt 1: winamp-eqf; sửa
   display/beat theo XML; vis AVS kiểu Webamp; zoom/fit + cân dọc; thêm
   nhạc 1 bài/thư mục; viên KBPS/KHZ; kéo resize mượt + tay nắm thấy
   được; Fit tính lại khi mở/đóng/tách/gắn cửa sổ).
   Đợt v10.0 (việc 2: chọn skin từ kho Webamp — skin-browser.js):
   ĐÃ GỠ HẲN ở đợt 5 (03/11, xem ghi chú manifest trên) — không còn
   panel #skin-panel, không còn menu "Chọn skin từ kho…", chỉ giữ
   "Nạp skin .wal/.zip…" chọn file tay.
   Đợt G: 9.2 → 9.3 (shade mode + sửa lằn đen menubar + tab ngăn kéo + trượt).
   Đợt H: 9.3 → 9.4 (sửa hình học cửa sổ chính theo Winamp thật + 8 lỗi đợt 3/11).
   Đợt I: 9.4 → 9.5 (bỏ banner self-check; bỏ hết bài Demo chỉ giữ radio.m3u;
   sửa lệch phải + lằn ngang đáy ngăn kéo lúc trượt = thanh cuộn #stage-wrap).
   Đợt J: 9.5 → 9.6 (6 điểm 3/11: chữ titlebar căn giữa + dời streak; nút X
   góc phải hiện lại; shadow ngăn kéo vẽ dưới tab; RepeatDisplay vẽ theo
   state; menu nền sáng + chống cắt; nền stage lót texture skin).
   Đợt K: 9.6 → 9.7 (3 điểm 3/11: chỉ báo stereo/mono; font songinfo vẽ nguyên
   bản không đảo alpha; vis vẽ lại vạch mẫu khi analyser im + cột trắng theo
   XML; VIDEO/VIS KHÔNG thêm — XML 566 không có chữ đó; sửa self-check 17→35).
   Đợt L: 9.7 → 9.8 (3/11: TV360 qua vmttv nghe tiếng không thấy hình —
   isVideoItem nhận diện nguồn TV qua host vmttv + đường dẫn /tv360/ /VTVGo/
   + group TV; lưới an toàn runtime setVideoInfo đổi mode theo videoWidth
   thật; nhập URL .m3u nạp cả danh sách qua parseM3U). */
window.AMP_VERSION = "10.2";
</script>
<script src="classic.js?v=10.2"></script>
<script src="skin-loader.js?v=10.2"></script>
<script src="audio.js?v=10.2"></script>
<script src="eqf.js?v=10.2"></script>
<script src="milkdrop.js?v=10.2"></script>
<script src="metadata.js?v=10.2"></script>
<script src="maki.js?v=10.2"></script>
<script src="renderer.js?v=10.2"></script>
<script>
"use strict";
/* Amp v9 — vỏ trang đợt E (cửa sổ chính + ngăn kéo + playlist + AVS/Video + tiếng).
   VERSION = "10.2" ở mọi file; lệch version thì dừng và báo rõ, không vẽ sai
   trong im lặng (bài học bản mix v7.4/v8). Đợt E KHÔNG đổi loader nên GIỮ
   "9.2" (audio.js là file mới, cùng version 9.2).
   Đợt F: nguồn sự thật duy nhất là window.AMP_VERSION (đặt ở thẻ script
   ngay trước 6 file JS); mỗi file tự đối chiếu manifest lúc nạp
   (MANIFEST_MISMATCH) để file cũ trên host tự tố mình.
   Đợt G (9.3): shade mode (layout main|shade 354×25), sửa lằn đen menubar
   (meta color-scheme: dark chống Chrome force-dark), tab ngăn kéo ẩn khi
   đóng, ngăn kéo trượt bằng CSS transition (renderer.toggleDrawerAnimated). */
/* BẮT BUỘC: bind rõ từng phần tử theo id ngay đầu script — không dựa vào
   biến global tự sinh từ id (id có gạch ngang không thành biến camelCase). */
var $ = function (s) { return document.querySelector(s); };
var stage = $("#stage"), stageWrap = $("#stage-wrap"), statusEl = $("#status"),
    btnMenu = $("#btn-menu"), menuPop = $("#menu-pop"), btnReopen = $("#btn-reopen"),
    fileInput = $("#skinpick");

var VERSION = "10.2";
var zoom = "fit"; /* Đợt 9.5: mặc định "fit" để thấy hết các góc (trước đây "1" làm playlist 436px bị cắt góc phải trên viewport 360px). */
var RES = null, SKIN = null, renderer = null, audioEngine = null;
/* Đợt 4 (03/11): crossfade + Milkdrop — chỉnh từ menu ⋯, lưu localStorage.
   crossfadeMs: 0 = tắt, mặc định 2000 (2s); milkdropOn: mặc định TẮT
   (tốn GPU/pin — bật từ menu ⋯ khi cần). */
var crossfadeMs = 2000;
var milkdropOn = false, milkdropCtl = null;
try { var _xf = parseInt(localStorage.getItem("amp9-xfade-ms") || "2000", 10); if (isFinite(_xf) && _xf >= 0 && _xf <= 10000) crossfadeMs = _xf; } catch (e) { /* bỏ qua */ }
try { milkdropOn = localStorage.getItem("amp9-milkdrop-v1") === "1"; } catch (e) { milkdropOn = false; }
var drawerOpen = false; /* ngăn kéo mặc định đóng (chỉ lộ 3px dưới đáy main + nút mở) */
var shadeMode = false; /* đợt G: shade mode mặc định tắt; khôi phục từ localStorage trước lần render đầu */
var playlistOpen = false; /* đợt C: playlist mặc định đóng; mở bằng nút PL, menu View, nút Xếp chồng */
/* Đợt A (9.9, việc 1): Media Library mặc định đóng; mở bằng nút ML trong
   skin, menu View, hoặc nút X trên titlebar ML để đóng. */
/* Đợt A (9.9, việc 6): kích thước cửa sổ đã kéo (playlist/ML/video rời),
   lưu localStorage "amp9-winsize-v9", khôi phục khi nạp trang. */
var mlOpen = false;

/* Đợt G — màn hình CHỈ HIỆN GIAO DIỆN: không còn dòng version thường
   trực trên màn hình. Thông báo thường → console (im lặng trên màn
   hình); chỉ LỖI mới hiện banner đỏ #status (version lệch, không nạp
   được skin...). Self-check KHÔNG còn banner (đợt 9.5: bỏ theo yêu cầu
   người dùng) — chỉ ghi console để debug. */
function setStatus(msg, isErr) {
  if (isErr) {
    statusEl.textContent = msg;
    statusEl.classList.add("show");
  } else if (window.console && console.info) {
    console.info("[Amp] " + msg);
  }

    renderer.toggleDrawerAnimated(drawerOpen).then(function () {
      setTimeout(function () {
        if (!renderer) return;
        var errs = [];
        try { errs = renderer.runDrawerSelfCheck(stage) || []; } catch (e) { errs = []; }
        if (drawerOpen && errs.length) {
          renderCurrent().catch(function (e) { setStatus("Lỗi: " + (e.message || e), true); });
          setTimeout(checkDrawer, 60);
        } else {
          checkDrawer();
        }
      }, 50);
    }).catch(function (e) { setStatus("Lỗi: " + (e.message || e), true); });
    return;
  }
  if (renderer) renderer.setDrawerOpen(drawerOpen);
  renderCurrent().catch(function (e) { setStatus("Lỗi: " + (e.message || e), true); });
  /* Fallback 50ms (V8-BUGS Lỗi 2): kiểm lại vị trí mở, lệch thì vẽ lại. */
  setTimeout(function () {
    if (!renderer) return;
    var errs = [];
    try { errs = renderer.runDrawerSelfCheck(stage) || []; } catch (e) { errs = []; }
    if (drawerOpen && errs.length) {
      renderCurrent().catch(function (e) { setStatus("Lỗi: " + (e.message || e), true); });

  document.addEventListener("click", function (e) {
    if (!menuPop || menuPop.hidden) return;
    if (e.target === btnMenu || (menuPop.contains && menuPop.contains(e.target))) return;
    closeMenu();
  });
  if (menuPop) menuPop.addEventListener("click", function (e) {
    var t = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "skin") { fileInput.click(); }
    else if (act === "localfile") {
      if (!renderer) { setStatus("Chưa nạp skin nào.", true); return; }
      renderer.openLocalFilePicker();
    }
    else if (act === "localdir") {
      if (!renderer) { setStatus("Chưa nạp skin nào.", true); return; }
      renderer.openLocalFolderPicker();
    }
    else if (act === "zoom1") { setZoom("1"); }
    else if (act === "zoomfit") { setZoom("fit"); }
    else if (act === "xfade") { cycleCrossfade(); }
    else if (act === "milkdrop") { toggleMilkdrop(); }
    else if (act === "maki") { openMakiPanel(); }
    closeMenu();
  });
  /* Đợt 7 (03/11) — đóng bảng MAKI: nút ✕, chạm ngoài panel, phím Esc.
     Bỏ qua cú chạm mở panel trong 250ms (cú chạm mở nổi bọt lên document
     SAU khi open() chạy — bài học panel chọn skin đợt 4). */
  var makiCloseBtn = document.getElementById("maki-close");
  if (makiCloseBtn) makiCloseBtn.addEventListener("click", function (e) {
    if (e.stopPropagation) e.stopPropagation();
    closeMakiPanel();
  });
  document.addEventListener("click", function (e) {
    if (!makiPanel || makiPanel.hidden) return;
    if (Date.now() - makiOpenedAt < 250) return;
    if (makiPanel.contains && makiPanel.contains(e.target)) return;
    if (e.target === btnMenu || (menuPop && menuPop.contains && menuPop.contains(e.target))) return;
    closeMakiPanel();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeMakiPanel();
  });
  /* Đợt 6 (03/11) — phím tắt: renderer.handleHotkey nhận mọi phím
     (Space, mũi tên, N/P, M, L, S, X/C/V…), tự bỏ qua khi focus trong
     ô nhập hoặc bấm kèm Ctrl/Alt/Meta, tự preventDefault khi đã xử lý.
     Đăng ký 1 lần ở đây (như phím Space đợt E) để đổi skin không đăng
     ký trùng — handler đọc biến renderer hiện tại. */
  document.addEventListener("keydown", function (e) {
    if (!renderer || !renderer.handleHotkey) return;
    try { renderer.handleHotkey(e); } catch (err) { /* phím tắt lỗi thì thôi, không vỡ trang */ }
  });
  fileInput.addEventListener("change", function () {
    if (fileInput.files.length) bootSkin(fileInput.files[0], fileInput.files[0].name);
  });
  window.addEventListener("resize", function () { if (zoom === "fit") setZoom("fit"); });
  /* Kéo-thả file .wal/.zip vào trang (giữ nguyên, không chữ hướng dẫn). */
  ["dragover", "dragenter", "dragleave", "drop"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); });
  });
  document.addEventListener("drop", function (e) {
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) bootSkin(f, f.name);
  });
}
wireMenu();
/* Đợt 7 (03/11, giai đoạn a) — bảng "Xem script MAKI…": CHỈ XEM, không
   chạy code MAKI. Đọc file .maki của skin đang nạp từ zip (RES.zip do
   loader giữ), parse + inspect bằng window.AmpMaki rồi vẽ bảng tóm tắt:
   mỗi file 1 dòng (lệnh/call/binding/ẩn-hiện/gán text) + <details> mở
   rộng xem binding, method gọi nhiều, 20 sự kiện ẩn/hiện đầu. Skin
   Classic (.wsz) thường không có .maki thì báo rõ "không có file .maki".
   Panel đóng bằng nút ✕ / chạm ngoài / Esc (quy tắc [hidden] đã sửa
   theo bài học panel chọn skin đợt 4 — CSS #maki-panel[hidden] đặt sau
   display nên hidden thật sự ẩn panel). */
var makiPanel = null, makiBody = null, makiOpenedAt = 0;
function makiPanelEls() {
  if (!makiPanel) makiPanel = document.getElementById("maki-panel");
  if (!makiBody) makiBody = document.getElementById("maki-body");
  return !!(makiPanel && makiBody);
}
function closeMakiPanel() { if (makiPanel) makiPanel.hidden = true; }
function makiTextEl(tag, text) {
  var el = document.createElement(tag);
  el.textContent = text;
  return el;
}
async function openMakiPanel() {
  if (!makiPanelEls()) { setStatus("Không tìm thấy bảng MAKI.", true); return; }
  makiPanel.hidden = false;
  makiOpenedAt = Date.now();
  makiBody.textContent = "Đang đọc script MAKI…";
  if (!window.AmpMaki) { makiBody.textContent = "Không nạp được maki.js."; return; }
  var zip = (RES && RES.zip) ? RES.zip : null;
  if (!zip) { makiBody.textContent = "Skin đang nạp không giữ file zip (không đọc được .maki)."; return; }
  var names = Object.keys(zip.files || {}).filter(function (n) { return /\.maki$/i.test(n) && !(zip.files[n] && zip.files[n].dir); }).sort();
  if (!names.length) { makiBody.textContent = "Skin này không có file .maki (skin Classic .wsz thường không có script MAKI)."; return; }
  try {
    var files = [];
    for (var i = 0; i < names.length; i++) {
      var data = await zip.files[names[i]].async("uint8array");
      files.push({ name: names[i].split("/").pop(), data: data });
    }
    var skin = window.AmpMaki.inspectSkinFiles(files);
    while (makiBody.firstChild) makiBody.removeChild(makiBody.firstChild);
    var t = skin.totals;
    makiBody.appendChild(makiTextEl("div", "Skin " + (SKIN && SKIN.name ? SKIN.name : "") + ": " + t.files + " file .maki · "
      + t.commands + " lệnh · " + t.calls + " call · " + t.bindings + " binding · "
      + t.visibility + " ẩn/hiện · " + t.textSets + " gán text"
      + (t.errors ? " · LỖI " + t.errors + " file" : "")
      + (t.unknownArity ? " · " + t.unknownArity + " call không rõ số đối số" : "")));
    makiBody.appendChild(makiTextEl("div", "Chỉ xem — không chạy code MAKI. Báo cáo đầy đủ: maki-566-report.md (skin 566)."));
    var table = document.createElement("table");
    var head = document.createElement("tr");
    ["File", "Call", "Binding", "Ẩn/hiện", "Gán text"].forEach(function (h) { head.appendChild(makiTextEl("th", h)); });
    table.appendChild(head);
    skin.results.forEach(function (r) {
      var tr = document.createElement("tr");
      if (r.error) {
        tr.appendChild(makiTextEl("td", r.name + " — LỖI: " + r.error));
        ["", "", "", ""].forEach(function () { tr.appendChild(makiTextEl("td", "")); });
      } else {
        var s = r.inspect.stats;
        tr.appendChild(makiTextEl("td", r.name));
        tr.appendChild(makiTextEl("td", String(s.calls)));
        tr.appendChild(makiTextEl("td", String(s.bindings)));
        tr.appendChild(makiTextEl("td", String(r.inspect.visibility.length)));
        tr.appendChild(makiTextEl("td", String(r.inspect.textSets.length)));
      }
      table.appendChild(tr);
    });
    makiBody.appendChild(table);
    skin.results.forEach(function (r) {
      if (r.error || !r.inspect) return;
      var det = document.createElement("details");
      det.appendChild(makiTextEl("summary", r.name + " — chi tiết"));
      det.appendChild(makiTextEl("div", "Binding: " + r.inspect.bindings.map(function (b) {
        return b.method + (b.variableDesc ? " trên " + b.variableDesc : " (var#" + b.variableOffset + ")");
      }).join(", ")));
      var top = Object.keys(r.inspect.callsByMethod).map(function (k) { return [k, r.inspect.callsByMethod[k]]; })
        .sort(function (a, b) { return b[1] - a[1]; }).slice(0, 8);
      det.appendChild(makiTextEl("div", "Method gọi nhiều: " + top.map(function (kv) { return kv[0] + "×" + kv[1]; }).join(", ")));
      r.inspect.visibility.slice(0, 20).forEach(function (e) {
        det.appendChild(makiTextEl("div", e.className + "." + e.method + " → " + e.target + (e.args.length ? " (" + e.args.join(", ") + ")" : "")));
      });
      if (r.inspect.visibility.length > 20) det.appendChild(makiTextEl("div", "…còn " + (r.inspect.visibility.length - 20) + " sự kiện ẩn/hiện nữa (xem báo cáo .md)."));
      makiBody.appendChild(det);
    });
  } catch (e) {
    makiBody.textContent = "Không đọc được script MAKI: " + (e && e.message ? e.message : e);
  }
}
/* Đợt 5 (03/11): openSkinBrowser + panel #skin-panel đã gỡ hẳn (xem
   ghi chú manifest trên) — nạp skin chỉ còn file tay (menu ⋯
   "Nạp skin .wal/.zip…", kéo-thả, hoặc bootSkin mặc định 566).
   Panel MAKI ở trên (#maki-panel) là panel XEM script, không phải panel
   chọn skin — đừng nhầm 2 panel này. */
if (checkVersions()) {
  logVersion("");
  (async function () {
    try {
      var r = await fetch("winampmodern566.wal");
      if (r.ok) {
        var buf = await r.arrayBuffer();
        await bootSkin(buf, "winampmodern566.wal");
        return;
      }
    } catch (e) { /* không có file cùng thư mục -> chờ kéo thả */ }
    setStatus("Chưa thấy file winampmodern566.wal cùng thư mục — kéo thả file .wal/.zip vào trang, hoặc bấm ⋯ (góc dưới-phải) → “Nạp skin .wal/.zip…”.", true);
  })();
} else {
  setStatus("Version lệch — dừng lại, xem banner đỏ ở trên.", true);
}
</script>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<!-- Đợt G — color-scheme: dark: trang này là trang TỐI (nền #141414) nhưng
     vẽ skin Winamp SÁNG (menubar RGB ~236, chữ đen). Chrome trên Android
     khi bật dark mode sẽ "force-dark" trang không khai báo scheme: nó đảo
     ngược ảnh sáng → menubar thành nền tối chữ sáng (vệt đen đo được trên
     ảnh điện thoại thật 2/11: RGB ~107), trong khi render desktop đúng.
     Khai báo dark = trang đã tự hỗ trợ dark → Chrome KHÔNG force-dark,
     skin vẽ đúng màu gốc. Đã kiểm chứng bằng headless Chrome + force-dark:
     có meta này thì menubar sáng (210,212,218) như bản thường. -->
<meta name="color-scheme" content="dark">
<title>Amp v9 — Winamp Modern (cửa sổ chính + ngăn kéo + playlist + AVS/Video)</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  /* Đợt G — màn hình CHỈ HIỆN GIAO DIỆN (skin Winamp): không tiêu đề,
     không dòng mô tả/version, không hàng nút HTML, không chữ hướng dẫn.
     Chỉ còn: cửa sổ skin (#stage) + 1 nút menu nhỏ ⋯ ở góc dưới-phải
     (nạp skin / thêm nhạc / zoom) + banner đỏ chỉ hiện khi lỗi. */
  html,body{margin:0;padding:0;background:#141414;color:#ccc;font-family:Verdana,Arial,sans-serif;}
  /* Đợt 9.5 (lỗi 3+4): body padding 0 — trước đây padding:8px đẩy toàn
     bộ stage sang phải 8px (trái hở, phải bị cắt: cửa sổ chính 354px
     tới x=362 trên viewport 360px; playlist 436px cắt 84px). Giờ các
     cửa sổ sát mép trái, cửa sổ chính vừa khít viewport 360px.
     Đợt 9.5 (lỗi 1): ẩn thanh cuộn ngang của #stage-wrap — thanh cuộn
     (xuất hiện vì stage 354px rộng hơn wrap 344px) chính là "lằn ngang"
     ở đáy ngăn kéo lúc trượt xuống: nó nằm ở đáy stage, hiện ra khi
     stage đổi cao (mở ngăn kéo) rồi mờ đi lúc nghỉ. Ẩn thanh cuộn nhưng
     vẫn giữ overflow-x:auto nên vẫn vuốt ngang được để xem playlist. */
  body{text-align:center;padding:0;}
  /* Đợt 9.5 (lỗi 6): stage/wrap co giãn chiều cao MƯỢT (250ms ease, khớp
     DRAWER_ANIM_MS) để đáy stage bám đáy ngăn kéo lúc trượt ra/vào —
     không còn khoản nền đen #000 lộ ra dưới ngăn kéo trong lúc trượt
     (trước đây stage nhảy ngay lên 280px lúc mở, ngăn kéo trượt sau
     250ms nên lộ nền đen; lúc đóng stage giữ 280 suốt lúc trượt rồi
     mới thu lại). */
  #stage-wrap{display:block;text-align:left;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;transition:height 250ms ease;}
  #stage-wrap::-webkit-scrollbar{display:none;}
  .stage{position:relative;margin:0 auto;overflow:hidden;background:#000;transform-origin:0 0;transition:height 250ms ease;
    box-shadow:0 0 0 1px #333, 0 8px 30px rgba(0,0,0,.6);}
  .stage .spr{position:absolute;display:block;border:0;padding:0;background-repeat:no-repeat;
    image-rendering:auto;-webkit-user-drag:none;user-select:none;pointer-events:none;}
  .stage .btn{position:absolute;padding:0;border:0;background:transparent;cursor:default;pointer-events:auto;}
  .stage .btn .spr{position:absolute;left:0;top:0;pointer-events:none;}
  .stage .txt{position:absolute;overflow:hidden;white-space:nowrap;pointer-events:none;line-height:1;}
  .stage .txt .glyph{display:inline-block;vertical-align:top;background-repeat:no-repeat;}
  .stage .ticker{position:absolute;overflow:hidden;white-space:nowrap;pointer-events:none;}
  .stage .ticker .inner{display:inline-block;white-space:nowrap;will-change:transform;}
  .stage .vis{position:absolute;pointer-events:none;}
  .stage .rect{position:absolute;pointer-events:none;}
  .stage .pl-list{position:absolute;overflow-y:auto;overflow-x:hidden;font-family:Arial,sans-serif;pointer-events:auto;}
  .stage .pl-list .row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:13px;padding:0 3px;cursor:default;}
  .stage .pl-list .row.sel{background:#6788c9;color:#d6e4ff;}
  .stage .pl-list .row.cur{color:#bbd2ff;font-weight:bold;}
  /* Banner lỗi: ẩn mặc định, chỉ hiện khi lỗi thật (version lệch,
     không nạp được skin). Self-check KHÔNG còn banner trên màn hình
     (đợt 9.5: người dùng chốt bỏ — chỉ ghi console để debug).
     Không có chữ thường trực trên màn hình. */
  #status{display:none;margin:8px auto;max-width:720px;font-size:12px;color:#e88;min-height:16px;text-align:left;line-height:1.5;}
  #status.show{display:block;border:1px solid #a33;background:#2a1111;padding:6px 8px;}
  /* Nút menu tối thiểu (⋯) ở góc dưới-phải: điểm chạm duy nhất ngoài
     skin — nạp skin .wal/.zip, thêm nhạc local, đổi zoom 1x/fit. Nhỏ,
     mờ, không thành hàng nút; bấm được trên điện thoại (36×36). */
  #btn-menu{position:fixed;right:10px;bottom:10px;z-index:50;width:36px;height:36px;
    border-radius:50%;background:rgba(236,233,216,.92);color:#000;border:1px solid #ACA899;
    font-size:18px;line-height:1;cursor:pointer;opacity:.85;padding:0;}
  #btn-menu:hover,#btn-menu:focus{opacity:1;border-color:#7a7663;color:#000;outline:none;}
  /* v9.6 (Điểm 5): menu ⋯ nền SÁNG như menu Winamp thật (#ECE9D8, chữ
     đen, hover #316AC5) — nền tối #1c1c1c cũ chìm vào nền trang #141414. */
  #menu-pop{position:fixed;right:10px;bottom:54px;z-index:50;background:#ECE9D8;
    border:1px solid #ACA899;border-radius:6px;padding:4px;min-width:200px;
    box-shadow:0 8px 30px rgba(0,0,0,.6);text-align:left;}
  #menu-pop button{display:block;width:100%;text-align:left;background:none;border:0;
    color:#000;padding:9px 10px;font-size:13px;cursor:pointer;border-radius:4px;font-family:Verdana,Arial,sans-serif;}
  #menu-pop button:hover{background:#316AC5;color:#fff;}
  #menu-pop button.on{color:#000;}
  #menu-pop button.on::before{content:"✓ ";}
  /* v9.6 (Điểm 2): nút mở lại khi bấm X ở cửa sổ chính — web không có
     "thoát app" như Winamp thật nên X ẩn giao diện, nút này hiện giữa
     màn hình để mở lại (không cần tải lại trang). Ẩn mặc định. */
  #btn-reopen{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:60;
    background:#ECE9D8;color:#000;border:1px solid #ACA899;border-radius:6px;
    padding:12px 22px;font-size:14px;cursor:pointer;font-family:Verdana,Arial,sans-serif;
    box-shadow:0 8px 30px rgba(0,0,0,.6);}
  #btn-reopen:hover{background:#316AC5;color:#fff;}
</style>
</head>
<body>
<div id="stage-wrap"><div class="stage" id="stage"></div></div>
<div id="status"></div>
<button id="btn-reopen" hidden>Mở lại Amp</button>
<button id="btn-menu" title="Menu: nạp skin, thêm nhạc, zoom" aria-label="Menu">⋯</button>
<div id="menu-pop" hidden>
  <button data-act="skin">Nạp skin .wal/.zip…</button>
  <button data-act="local">Thêm nhạc local…</button>
  <button data-act="zoom1">Zoom: Cỡ gốc 1x</button>
  <button data-act="zoomfit">Zoom: Vừa màn hình</button>
</div>
<input type="file" id="skinpick" accept=".wal,.zip" hidden>

<script>
/* Đợt F — VERSION MANIFEST DUY NHẤT: "9.7" là nguồn sự thật, đặt TRƯỚC
   mọi file JS. skin-loader.js / audio.js / renderer.js đọc window.AMP_VERSION
   lúc nạp để tự kiểm (MANIFEST_MISMATCH); index.html kiểm lại ở
   checkVersions() và DỪNG + báo "bản mix" nếu lệch 1 file. Đổi version thì
   đổi CHỖ NÀY + 3 hằng version trong 3 file JS + ?v= trên 3 thẻ script.
   Đợt G: 9.2 → 9.3 (shade mode + sửa lằn đen menubar + tab ngăn kéo + trượt).
   Đợt H: 9.3 → 9.4 (sửa hình học cửa sổ chính theo Winamp thật + 8 lỗi đợt 3/11).
   Đợt I: 9.4 → 9.5 (bỏ banner self-check; bỏ hết bài Demo chỉ giữ radio.m3u;
   sửa lệch phải + lằn ngang đáy ngăn kéo lúc trượt = thanh cuộn #stage-wrap).
   Đợt J: 9.5 → 9.6 (6 điểm 3/11: chữ titlebar căn giữa + dời streak; nút X
   góc phải hiện lại; shadow ngăn kéo vẽ dưới tab; RepeatDisplay vẽ theo
   state; menu nền sáng + chống cắt; nền stage lót texture skin).
   Đợt K: 9.6 → 9.7 (3 điểm 3/11: chỉ báo stereo/mono; font songinfo vẽ nguyên
   bản không đảo alpha; vis vẽ lại vạch mẫu khi analyser im + cột trắng theo
   XML; VIDEO/VIS KHÔNG thêm — XML 566 không có chữ đó; sửa self-check 17→35). */
window.AMP_VERSION = "9.7";
</script>
<script src="skin-loader.js?v=9.7"></script>
<script src="audio.js?v=9.7"></script>
<script src="renderer.js?v=9.7"></script>
<script>
"use strict";
/* Amp v9 — vỏ trang đợt E (cửa sổ chính + ngăn kéo + playlist + AVS/Video + tiếng).
   VERSION = "9.7" ở mọi file; lệch version thì dừng và báo rõ, không vẽ sai
   trong im lặng (bài học bản mix v7.4/v8). Đợt E KHÔNG đổi loader nên GIỮ
   "9.2" (audio.js là file mới, cùng version 9.2).
   Đợt F: nguồn sự thật duy nhất là window.AMP_VERSION (đặt ở thẻ script
   ngay trước 3 file JS); mỗi file tự đối chiếu manifest lúc nạp
   (MANIFEST_MISMATCH) để file cũ trên host tự tố mình.
   Đợt G (9.3): shade mode (layout main|shade 354×25), sửa lằn đen menubar
   (meta color-scheme: dark chống Chrome force-dark), tab ngăn kéo ẩn khi
   đóng, ngăn kéo trượt bằng CSS transition (renderer.toggleDrawerAnimated). */
/* BẮT BUỘC: bind rõ từng phần tử theo id ngay đầu script — không dựa vào
   biến global tự sinh từ id (id có gạch ngang không thành biến camelCase). */
var $ = function (s) { return document.querySelector(s); };
var stage = $("#stage"), stageWrap = $("#stage-wrap"), statusEl = $("#status"),
    btnMenu = $("#btn-menu"), menuPop = $("#menu-pop"), btnReopen = $("#btn-reopen"),
    fileInput = $("#skinpick");

var VERSION = "9.7";
var zoom = "fit"; /* Đợt 9.5: mặc định "fit" để thấy hết các góc (trước đây "1" làm playlist 436px bị cắt góc phải trên viewport 360px). */
var RES = null, SKIN = null, renderer = null, audioEngine = null;
var drawerOpen = false; /* ngăn kéo mặc định đóng (chỉ lộ 3px dưới đáy main + nút mở) */
var shadeMode = false; /* đợt G: shade mode mặc định tắt; khôi phục từ localStorage trước lần render đầu */
var playlistOpen = false; /* đợt C: playlist mặc định đóng; mở bằng nút PL, menu View, nút Xếp chồng */

/* Đợt G — màn hình CHỈ HIỆN GIAO DIỆN: không còn dòng version thường
   trực trên màn hình. Thông báo thường → console (im lặng trên màn
   hình); chỉ LỖI mới hiện banner đỏ #status (version lệch, không nạp
   được skin...). Self-check KHÔNG còn banner (đợt 9.5: bỏ theo yêu cầu
   người dùng) — chỉ ghi console để debug. */
function setStatus(msg, isErr) {
  if (isErr) {
    statusEl.textContent = msg;
    statusEl.classList.add("show");
  } else if (window.console && console.info) {
    console.info("[Amp] " + msg);
  }
}
/* Version chỉ ghi vào console + tiêu đề tab (không hiện ra màn hình).
   Đúng version thì im lặng; lệch thì checkVersions() báo đỏ qua
   setStatus(..., true) và dừng boot. */
function logVersion(extra) {
  var line = "Amp v9 · loader v" + (window.AmpSkinLoader ? window.AmpSkinLoader.LOADER_VERSION : "?")
    + " · audio v" + (window.AmpAudio ? window.AmpAudio.AUDIO_VERSION : "?")
    + " · renderer v" + (window.AmpRenderer ? window.AmpRenderer.RENDERER_VERSION : "?")
    + " · model fromCache: " + (RES ? String(RES.fromCache) : "?") + (extra ? " · " + extra : "");
  if (window.console && console.info) console.info("[Amp] " + line);
  try { document.title = "Amp v9.7 — Winamp Modern"; } catch (e) { /* bỏ qua */ }
}
function checkVersions() {
  var bad = [];
  if (!window.AmpSkinLoader || window.AmpSkinLoader.LOADER_VERSION !== VERSION) bad.push("skin-loader.js v" + (window.AmpSkinLoader ? window.AmpSkinLoader.LOADER_VERSION : "?"));
  if (!window.AmpAudio || window.AmpAudio.AUDIO_VERSION !== VERSION) bad.push("audio.js v" + (window.AmpAudio ? window.AmpAudio.AUDIO_VERSION : "?"));
  if (!window.AmpRenderer || window.AmpRenderer.RENDERER_VERSION !== VERSION) bad.push("renderer.js v" + (window.AmpRenderer ? window.AmpRenderer.RENDERER_VERSION : "?"));
  if (window.AmpSkinLoader && window.AmpSkinLoader.LOADER_VERSION !== window.AmpSkinLoader.EXPECTED_LOADER_VERSION) bad.push("loader lệch EXPECTED_LOADER_VERSION");
  /* Đợt F — mỗi file tự đối chiếu với manifest lúc nạp (MANIFEST_MISMATCH):
     file cũ trên host/cache sẽ tự tố mình dù hằng VERSION trong trang đã mới. */
  if (window.AmpSkinLoader && window.AmpSkinLoader.MANIFEST_MISMATCH) bad.push("skin-loader.js v" + window.AmpSkinLoader.LOADER_VERSION + " (manifest v" + VERSION + ")");
  if (window.AmpAudio && window.AmpAudio.MANIFEST_MISMATCH) bad.push("audio.js v" + window.AmpAudio.AUDIO_VERSION + " (manifest v" + VERSION + ")");
  if (window.AmpRenderer && window.AmpRenderer.MANIFEST_MISMATCH) bad.push("renderer.js v" + window.AmpRenderer.RENDERER_VERSION + " (manifest v" + VERSION + ")");
  if (bad.length) {
    setStatus("BẢN MIX — version lệch, dừng lại: " + bad.join(" + ") + " (cần v" + VERSION + " ở mọi file)", true);
    return false;
  }
  return true;
}
/* Đợt E — lưu state phát (playing/current/repeat/shuffle/volume/EQ) vào
   localStorage, debounce 300ms vì kéo slider gọi liên tục. */
var savePlayTimer = 0;
function savePlaybackState(st) {
  if (savePlayTimer) clearTimeout(savePlayTimer);
  savePlayTimer = setTimeout(function () {
    savePlayTimer = 0;
    try { localStorage.setItem("amp9-play-v9", JSON.stringify(st)); } catch (e) { /* private mode */ }
  }, 300);
}
function loadPlaybackState() {
  try {
    var s = JSON.parse(localStorage.getItem("amp9-play-v9") || "null");
    return s && typeof s === "object" ? s : null;
  } catch (e) { return null; }
}
function ensureJSZip() {
  return new Promise(function (resolve, reject) {
    if (window.JSZip) return resolve(window.JSZip);
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = function () { window.JSZip ? resolve(window.JSZip) : reject(new Error("không tải được JSZip")); };
    s.onerror = function () { reject(new Error("không tải được JSZip (cần mạng)")); };
    document.head.appendChild(s);
  });
}
/* Đợt G — chỉ 2 chế độ zoom: "1" (cỡ gốc) và "fit" (Vừa màn hình).
   Đợt 9.5 (lỗi 3+4): fit được phép THU NHỎ dưới 1x để vừa màn hình
   (trước đây max(1,s) chặn lại nên playlist 436px trên viewport 360px
   luôn bị cắt góc phải); availW lấy đủ chiều rộng cha, không trừ 24px
   (số 24 cũ làm fit thu nhỏ oan cả cửa sổ chính 354px dù đã vừa 360px).
   transform-origin:0 0 (đặt ở CSS .stage) nên scale không cắt đỉnh
   stage như lỗi fit đợt 9.4. Mặc định là "fit" để thấy hết các góc;
   chọn 1x trong menu ⋯ để về cỡ gốc (vuốt ngang xem playlist).
   Nút 2x/3x đã bỏ khỏi thanh công cụ (người dùng chốt 3/11: web chỉ
   cần 1x + fit). Mọi mode khác "fit" đều về 1x. Zoom giữ mượt như cũ
   (scale transform + image-rendering:auto, KHÔNG pixelated). */
function setZoom(mode) {
  if (mode !== "fit") mode = "1";
  zoom = mode;
  var LW = parseInt(stage.style.width) || 354;
  var LH = parseInt(stage.style.height) || 143;
  var s = 1;
  if (mode === "fit") {
    var availW = Math.max(200, stageWrap.parentElement.clientWidth);
    var availH = Math.max(120, window.innerHeight - 340);
    s = Math.min(availW / LW, availH / LH, 2.5);
  }
  stage.style.transform = "scale(" + s + ")";
  stageWrap.style.width = "100%";
  stageWrap.style.height = Math.round(LH * s) + "px";
  /* Đợt 9.5 (lỗi 4): margin 0 khi stage (đã scale) gần lấp đầy wrap
     (trong 1px) — trước đây chỉ khi ">" nên trường hợp vừa khít
     (LW*s == clientWidth, vd 354×1.017=360) vẫn giữ "0 auto" (3px mỗi
     bên), cộng scale khiến mép phải tràn 3px ra ngoài wrap. */
  stage.style.margin = (LW * s > stageWrap.clientWidth - 1) ? "0" : "0 auto";
  /* Đánh dấu chế độ đang chọn trong menu ⋯ (không còn nút zoom trên
     thanh công cụ). */
  if (menuPop) {
    var z1 = menuPop.querySelector('[data-act="zoom1"]');
    var zf = menuPop.querySelector('[data-act="zoomfit"]');
    if (z1) z1.classList.toggle("on", mode === "1");
    if (zf) zf.classList.toggle("on", mode === "fit");
  }
}
async function renderCurrent() {
  if (!renderer) return;
  /* Đợt C: playlist mở thì xếp chồng Player + Playlist (stage rộng 436);
     đóng thì chỉ cửa sổ chính (354). Tổng cao = playerH + playlistH:
     ngăn kéo đóng 156+164=320 (đỉnh ngăn kéo lộ 13px), ngăn kéo mở
     259+164=423.
     Đợt G — shadeMode: vẽ layout shade 354×25 (không ngăn kéo, không AVS
     nhúng); playlist rời vẫn xếp dưới shade nếu đang mở (25+164=189). */
  if (shadeMode) {
    if (playlistOpen) {
      await renderer.renderStacked(stage, { shadeMode: true });
    } else {
      await renderer.renderLayout("main", "shade", "WINAMP", {}, stage);
    }
  } else if (playlistOpen) {
    await renderer.renderStacked(stage, { drawerOpen: drawerOpen });
  } else {
    await renderer.renderLayout("main", "normal", "WINAMP", { drawerOpen: drawerOpen }, stage);
  }
  setZoom(zoom);
  checkDrawer();
}
/* Đợt G — chuyển normal<->shade (nút winshade trong skin / bấm đúp nền
   shade). Lưu localStorage để tải lại trang giữ nguyên chế độ. Khi sang
   shade thì ẩn ngăn kéo + vùng AVS nhúng (chỉ còn thanh bar 25px);
   avsState được giữ nguyên nên về normal thì AVS hiện lại như cũ. */
function setShadeMode(open) {
  shadeMode = !!open;
  try { localStorage.setItem("amp9-shade-v9", shadeMode ? "1" : "0"); } catch (e) { /* private mode */ }
  renderCurrent().catch(function (e) { setStatus("Lỗi: " + (e.message || e), true); });
}
/* Đợt C: mở/đóng playlist (nút PL trong skin, menu View, nút đóng X của
   cửa sổ Playlist). Đóng/mở thì các cửa sổ xếp lại theo đúng thứ tự
   chồng (main → drawer → playlist). */
function setPlaylistOpen(open) {
  playlistOpen = !!open;
  renderCurrent().catch(function (e) { setStatus("Lỗi: " + (e.message || e), true); });
}
/* Self-check sau khi vẽ (đợt B + đợt F): sai thì ghi console, KHÔNG
   hiện banner trên màn hình (đợt 9.5: người dùng chốt bỏ banner
   tự kiểm — "nếu không có gì thì bỏ luôn cũng được"). Mở ngăn kéo đặt
   thẳng vị trí cuối trong lúc vẽ (một bước, không rAF hai bước) nên
   chỉ cần kiểm lại sau 50ms: nếu vị trí lệch thì vẽ lại một lần.
   Đợt F: chung 1 lần chạy cho cả 3 self-check — ngăn kéo (chỉ khi
   đang mở), AVS/Video (hình học vùng nhúng/cửa sổ rời), tiếng (EQ bật
   + đang phát mà chưa nối MediaElementSource). */
function checkDrawer() {
  if (!renderer) return;
  var errs = [];
  /* Đợt G — shadeMode: không có ngăn kéo trong DOM (runDrawerSelfCheck
     báo "không thấy ngăn kéo") và AVS nhúng bị ẩn theo thiết kế dù
     avsState đang mở — cả hai đều là false positive, bỏ qua. Self-check
     tiếng vẫn chạy (engine độc lập với layout). */
  if (!shadeMode) {
    try { errs = renderer.runDrawerSelfCheck(stage) || []; } catch (e) { errs = ["self-check loi: " + (e.message || e)]; }
    /* Ngăn kéo đóng (chỉ lộ dải 13px) thì self-check hình học mở không áp;
       chỉ báo khi đang mở mà lệch. AVS/tiếng kiểm luôn, không phụ thuộc ngăn kéo. */
    if (!drawerOpen) errs = [];
    try { errs = errs.concat(renderer.runAvsSelfCheck(stage) || []); } catch (e) { errs.push("self-check AVS loi: " + (e.message || e)); }
  }
  try { errs = errs.concat(renderer.runAudioSelfCheck() || []); } catch (e) { errs.push("self-check tieng loi: " + (e.message || e)); }
  /* Đợt 9.5: chỉ ghi console, không hiện banner (đã gỡ #drawer-check). */
  if (errs.length && window.console && console.warn) console.warn("[Amp] SELF-CHECK: " + errs.join(" | "));
}
/* Đợt G — mở/đóng ngăn kéo TRƯỢT MƯỢT bằng CSS transition trên transform
   (renderer.toggleDrawerAnimated): mở trượt xuống, đóng trượt lên, ~250ms.
   Vị trí cuối luôn do renderLayout đặt thẳng bằng `top` nên không kẹt
   giữa chừng (bấm liên tục: lần sau hủy timer lần trước, nội suy từ vị
   trí hiện tại). Sau khi trượt xong (promise) kiểm lại 1 lần: lệch thì
   vẽ lại + báo rõ. Không có toggleDrawerAnimated (renderer cũ) thì về
   đường cũ: setDrawerOpen + render + fallback 50ms. */
function toggleDrawer(open) {
  drawerOpen = !!open;
  if (renderer && renderer.toggleDrawerAnimated) {
    renderer.toggleDrawerAnimated(drawerOpen).then(function () {
      setTimeout(function () {
        if (!renderer) return;
        var errs = [];
        try { errs = renderer.runDrawerSelfCheck(stage) || []; } catch (e) { errs = []; }
        if (drawerOpen && errs.length) {
          renderCurrent().catch(function (e) { setStatus("Lỗi: " + (e.message || e), true); });
          setTimeout(checkDrawer, 60);
        } else {
          checkDrawer();
        }
      }, 50);
    }).catch(function (e) { setStatus("Lỗi: " + (e.message || e), true); });
    return;
  }
  if (renderer) renderer.setDrawerOpen(drawerOpen);
  renderCurrent().catch(function (e) { setStatus("Lỗi: " + (e.message || e), true); });
  /* Fallback 50ms (V8-BUGS Lỗi 2): kiểm lại vị trí mở, lệch thì vẽ lại. */
  setTimeout(function () {
    if (!renderer) return;
    var errs = [];
    try { errs = renderer.runDrawerSelfCheck(stage) || []; } catch (e) { errs = []; }
    if (drawerOpen && errs.length) {
      renderCurrent().catch(function (e) { setStatus("Lỗi: " + (e.message || e), true); });
      setTimeout(checkDrawer, 60);
    } else {
      checkDrawer();
    }
  }, 50);
}
async function bootSkin(file, name) {
  setStatus("Đang mở " + name + " …");
  try {
    await ensureJSZip();
    var loaded = await window.AmpSkinLoader.loadSkinFile(file, { JSZip: window.JSZip, name: name });
    SKIN = loaded.skin; RES = loaded.resolve;
    renderer = window.AmpRenderer.createRenderer(RES, document, {
      /* Đợt G — onRerender TRẢ VỀ promise của renderCurrent để
         toggleDrawerAnimated chờ vẽ xong mới bắt đầu trượt. */
      onRerender: function () { return renderCurrent().catch(function (e) { setStatus("Lỗi: " + (e.message || e), true); }); },
      onDrawerToggle: function (open) { toggleDrawer(open); },
      /* Đợt G — nút winshade trong skin (SWITCH param=shade/normal) /
         bấm đúp nền shade: chuyển chế độ + lưu localStorage. */
      onShadeToggle: function (open) { setShadeMode(open); },
      /* Đợt C: nút PL trong skin / menu View / nút đóng X của playlist. */
      onPlaylistToggle: function (open) {
        if (open === undefined) setPlaylistOpen(!playlistOpen);
        else setPlaylistOpen(!!open);
      },
      /* v9.6 (Điểm 2): nút X của cửa sổ chính — web không "thoát app"
         như Winamp thật: ẩn giao diện + nút ⋯, hiện nút "Mở lại Amp"
         (không dừng tiếng; bấm nút mở lại thì giao diện hiện lại). */
      onPlayerClose: function () {
        try { stageWrap.style.display = "none"; } catch (e) { /* bỏ qua */ }
        try { btnMenu.style.display = "none"; } catch (e) { /* bỏ qua */ }
        try { menuPop.hidden = true; } catch (e) { /* bỏ qua */ }
        try { btnReopen.hidden = false; } catch (e) { /* bỏ qua */ }
      },
      isPlaylistOpen: function () { return playlistOpen; },
      /* Đợt C: menu Add/File/List "Nạp lại radio.m3u" — nạp lại file cùng
         thư mục rồi đặt làm dữ liệu playlist (41 kênh). */
      onReloadRadio: async function () {
        try {
          var r = await fetch("radio.m3u");
          if (r.ok) {
            var t = await r.text();
            var n = renderer.setPlaylistData(t, "radio.m3u", "radio.m3u");
            setStatus("Đã nạp lại radio.m3u: " + n + " mục.");
          }
        } catch (e) { setStatus("Không nạp lại được radio.m3u: " + (e.message || e), true); }
      },
      /* Đợt D — đường (d) restore: lưu state AVS (mở/chế độ/tách rời/
         scale) mỗi khi đổi, để lần nạp trang sau mở lại đúng trạng thái. */
      onAvsChange: function (st) {
        try { localStorage.setItem("amp9-avs-v9", JSON.stringify(st)); } catch (e) { /* private mode */ }
      },
      /* Đợt E — lưu state phát (playing/current/repeat/shuffle/volume/EQ)
         mỗi khi đổi, để lần nạp trang sau khôi phục (trừ file local). */
      onPlaybackChange: function (st) { savePlaybackState(st); }
    });
    /* Đợt E — tạo audio engine SAU renderer (engine cần getVideoEl/
       isVideoItem của renderer), rồi gắn vào renderer. */
    if (window.AmpAudio) {
      audioEngine = window.AmpAudio.createAudioEngine({
        document: document, window: window,
        getVideoEl: function () { return renderer.getAvsMedia().video; },
        resetVideoEl: function () { return renderer.resetAvsMedia(); },
        isVideoItem: function (it) { return renderer.isVideoItem(it); },
        onTimeUpdate: function (t, dur, seekable) { renderer.onAudioTimeUpdate(t, dur, seekable); },
        onEnded: function () { renderer.onAudioEnded(); },
        onError: function (info) { renderer.onAudioError(info); },
        onPlayingChange: function (p) { renderer.onAudioPlayingChange(p); checkDrawer(); /* đợt F: phát/dừng thì chạy lại self-check tiếng */ },
        onAnalyser: function (an) { renderer.setAvsAnalyser(an); }
      });
      renderer.setAudioEngine(audioEngine);
    }
    /* Đợt D — restore trạng thái AVS đã lưu TRƯỚC lần render đầu. */
    try {
      var savedAvs = JSON.parse(localStorage.getItem("amp9-avs-v9") || "null");
      if (savedAvs) renderer.restoreAvsState(savedAvs);
    } catch (e) { /* state lưu hỏng thì mở mặc định (đóng) */ }
    /* Đợt G — khôi phục shadeMode đã lưu TRƯỚC lần render đầu (mặc định
       normal). Shade vẽ layout main|shade 354×25, không ngăn kéo/AVS. */
    try { shadeMode = localStorage.getItem("amp9-shade-v9") === "1"; } catch (e) { shadeMode = false; }
    var finalH = shadeMode
      ? await renderer.renderLayout("main", "shade", "WINAMP", {}, stage)
      : await renderer.renderLayout("main", "normal", "WINAMP", { drawerOpen: drawerOpen }, stage);
    checkDrawer();
    /* Đợt C: nạp radio.m3u cùng thư mục làm nguồn playlist mặc định
       (41 kênh, giữ tên + thứ tự gốc). Không có file thì playlist
       trống, vẫn vẽ được. */
    var playlistInfo = "Playlist: (trống) — chưa thấy radio.m3u cùng thư mục";
    try {
      var rr = await fetch("radio.m3u");
      if (rr.ok) {
        var rt = await rr.text();
        var rn = renderer.setPlaylistData(rt, "radio.m3u", "radio.m3u");
        var pst = renderer.getPlaylistState();
        playlistInfo = "Playlist: " + pst.source + " — " + rn + " mục (nhóm: "
          + Object.keys(pst.groups).map(function (k) { return k + " " + pst.groups[k]; }).join(", ")
          + ") · tổng thời gian " + Math.floor(pst.total / 60) + ":" + String(pst.total % 60).padStart(2, "0");
      }
    } catch (e) { /* giữ playlist trống */ }
    /* Đợt E — khôi phục state phát đã lưu (volume/EQ/repeat/shuffle/
       mục đang chọn). Không tự phát lại. */
    try {
      var savedPlay = loadPlaybackState();
      if (savedPlay) renderer.restorePlaybackState(savedPlay);
    } catch (e) { /* state lưu hỏng thì mở mặc định */ }
    var lay = RES.layouts["main|normal"] || RES.layouts["normal"];
    var lines = [];
    lines.push("Skin: " + (SKIN.name || "(không tên)") + (SKIN.version ? " v" + SKIN.version : ""));
    if (SKIN.author) lines.push("Tác giả: " + SKIN.author);
    lines.push("Bitmap: " + Object.keys(RES.bitmaps).length + " · Font: " + Object.keys(RES.fonts).length
      + " · Màu: " + Object.keys(RES.colors).length + " · Group: " + Object.keys(RES.groupdefs).length
      + " · Layout: " + Object.keys(RES.layouts).length);
    if (lay) lines.push("Layout main|normal: " + lay.w + "×" + lay.h + " · contentH=" + lay.contentH
      + " (frameOffsetY=" + lay.frameOffsetY + ") · snapadjustbottom=" + lay.snapadjustbottom
      + " · drawerRestY=" + lay.drawerRestY + " · cửa sổ chính sau trim: 354×" + finalH);
    var layShade = RES.layouts["main|shade"];
    if (layShade) lines.push("Layout main|shade: " + layShade.w + "×" + layShade.h
      + " · group shademain (thanh transport 25px, gọn khít, không ngăn kéo/AVS; về normal bằng nút winshade hoặc bấm đúp nền)"
      + (shadeMode ? " · ĐANG Ở SHADE (sau trim: 354×" + finalH + ")" : ""));
    if (RES.drawer) lines.push("Ngăn kéo: cao " + RES.drawer.fullH + " · contentX=" + RES.drawer.contentX
      + " · tabs=(" + (RES.drawer.tabsPos ? RES.drawer.tabsPos.x + "," + RES.drawer.tabsPos.y : "?") + ")");
    if (RES.embeddedAvs) {
      var ea = RES.embeddedAvs;
      lines.push("AVS nhúng (embeddedAvs): có — " + ea.w + "×" + ea.h + " tại (" + ea.x + "," + ea.y + "), video.group "
        + ea.videoRect.w + "×" + ea.videoRect.h + " tại (" + ea.videoRect.x + "," + ea.videoRect.y + ")");
    } else {
      lines.push("AVS nhúng (embeddedAvs): không" + (RES.kind === "classic" ? " (skin Classic .wsz — chỉ cửa sổ Video/Hiệu ứng rời)" : " — chỉ cửa sổ rời"));
    }
    var avsNow = renderer.getAvsState();
    lines.push("AVS hiện tại: " + (avsNow.open ? ("mở, chế độ " + avsNow.mode + (avsNow.detached ? ", cửa sổ rời" : ", vùng nhúng") + ", scale " + avsNow.videoScale + "x") : "đóng"));
    lines.push(playlistInfo);
    if (loaded.report.notes.length) lines.push("Ghi chú: " + loaded.report.notes.join(" | "));
    /* Thông tin skin chỉ ghi console (màn hình chỉ hiện giao diện). */
    if (window.console && console.info) console.info("[Amp]\n" + lines.join("\n"));
    logVersion("skin: " + (SKIN.name || name));
    setZoom(zoom);
    if (RES.kind === "classic") {
      setStatus("Đã nạp skin Classic " + (SKIN.name || name) + " — skin Classic không có vùng AVS nhúng và cửa sổ chính chưa vẽ được ở v9; mở Video / Hiệu ứng (Vis) từ menu View trong skin để mở cửa sổ rời (đợt E đã phát tiếng qua chuỗi EQ).");
    } else {
      setStatus("Đã nạp: " + (SKIN.name || name) + " — ngăn kéo mở bằng nút trong skin / menu View; nút PL (hoặc menu View) mở Playlist; nhấp đúp kênh để phát (Space = Play/Pause). Kênh TV (Đà Nẵng…) chỉ xem được khi EQ TẮT — bật EQ thì crossOrigin=anonymous, server không có CORS nên không nạp được (như Webamp fork).");
    }
  } catch (e) {
    setStatus("Lỗi: " + (e.message || e), true);
  }
}
/* Đợt G — menu tối thiểu (⋯) ở góc trang: điểm chạm duy nhất ngoài skin.
   Chứa những thứ skin không làm được: nạp skin .wal/.zip (chọn file),
   thêm nhạc local, đổi zoom 1x/fit. Mọi chức năng khác (ngăn kéo,
   playlist, Video/Vis) dùng qua chính skin: nút trong skin + menu View
   (File/Play/Options/View/Help) — xem viewMenuItems trong renderer.js.
   Kéo-thả file .wal/.zip vào trang vẫn giữ (không cần chữ hướng dẫn). */
function wireMenu() {
  function closeMenu() { if (menuPop) menuPop.hidden = true; }
  function toggleMenu() {
    if (!menuPop) return;
    menuPop.hidden = !menuPop.hidden;
    if (!menuPop.hidden) setZoom(zoom); /* cập nhật dấu ✓ zoom hiện tại */
  }
  if (btnMenu) btnMenu.addEventListener("click", function (e) {
    if (e.stopPropagation) e.stopPropagation();
    toggleMenu();
  });
  /* v9.6 (Điểm 2): nút "Mở lại Amp" — hiện lại giao diện sau khi bấm X
     ở cửa sổ chính (onPlayerClose đã ẩn stage-wrap + nút ⋯). */
  if (btnReopen) btnReopen.addEventListener("click", function () {
    try { stageWrap.style.display = ""; } catch (e) { /* bỏ qua */ }
    try { btnMenu.style.display = ""; } catch (e) { /* bỏ qua */ }
    try { btnReopen.hidden = true; } catch (e) { /* bỏ qua */ }
    try { renderCurrent(); } catch (e) { /* bỏ qua */ }
  });
  document.addEventListener("click", function (e) {
    if (!menuPop || menuPop.hidden) return;
    if (e.target === btnMenu || (menuPop.contains && menuPop.contains(e.target))) return;
    closeMenu();
  });
  if (menuPop) menuPop.addEventListener("click", function (e) {
    var t = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "skin") { fileInput.click(); }
    else if (act === "local") {
      if (!renderer) { setStatus("Chưa nạp skin nào.", true); return; }
      renderer.openLocalFolderPicker();
    }
    else if (act === "zoom1") { setZoom("1"); }
    else if (act === "zoomfit") { setZoom("fit"); }
    closeMenu();
  });
  /* Đợt E — phím Space: Play/Pause khi focus không nằm trong ô nhập. */
  document.addEventListener("keydown", function (e) {
    if (!renderer) return;
    if (e.code !== "Space" && e.key !== " ") return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if (e.preventDefault) e.preventDefault();
    renderer.togglePlay();
  });
  fileInput.addEventListener("change", function () {
    if (fileInput.files.length) bootSkin(fileInput.files[0], fileInput.files[0].name);
  });
  window.addEventListener("resize", function () { if (zoom === "fit") setZoom("fit"); });
  /* Kéo-thả file .wal/.zip vào trang (giữ nguyên, không chữ hướng dẫn). */
  ["dragover", "dragenter", "dragleave", "drop"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); });
  });
  document.addEventListener("drop", function (e) {
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) bootSkin(f, f.name);
  });
}
wireMenu();
if (checkVersions()) {
  logVersion("");
  (async function () {
    try {
      var r = await fetch("winampmodern566.wal");
      if (r.ok) {
        var buf = await r.arrayBuffer();
        await bootSkin(buf, "winampmodern566.wal");
        return;
      }
    } catch (e) { /* không có file cùng thư mục -> chờ kéo thả */ }
    setStatus("Chưa thấy file winampmodern566.wal cùng thư mục — kéo thả file .wal/.zip vào trang, hoặc bấm ⋯ (góc dưới-phải) → “Nạp skin .wal/.zip…”.", true);
  })();
} else {
  setStatus("Version lệch — dừng lại, xem banner đỏ ở trên.", true);
}
</script>

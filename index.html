<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amp — v4 (nạp skin .wal/.zip, thư viện qua CDN)</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="skin-loader.js"></script>
<style>
  html,body{margin:0;padding:0;background:#000;color:#ccc;
    font-family:Verdana,Arial,sans-serif;}
  body{text-align:center;}
  h1{font-size:13px;color:#888;margin:10px 0 2px;font-weight:normal;}
  h1 b{color:#bbb;}
  #skinsub{font-size:11px;color:#666;}
  /* --- the skin stage: coordinate space = layout size from the skin, scaled by CSS transform --- */
  #viewport{position:relative;margin:10px auto 0;}
  #viewport.dragover{outline:2px dashed #6a0;outline-offset:4px;}
  #scaler{position:absolute;left:0;top:0;width:436px;height:160px;
    transform-origin:top left;background:#000 no-repeat 0 0;overflow:hidden;}
  /* overflow:hidden: the skin window clips to its own box, like Winamp's
     shaped window — a layer that sticks out (e.g. a sprite reused at the
     wrong size) must not widen the page or paint over the panel below. */
  #scaler img{position:absolute;display:block;border:0;padding:0;
    image-rendering:auto;-webkit-user-drag:none;user-select:none;}
  #scaler .btn{position:absolute;padding:0;border:0;background:transparent;
    cursor:pointer;}
  #scaler .btn img{position:static;width:100%;height:100%;}
  #ticker{position:absolute;overflow:hidden;white-space:nowrap;
    color:#b9b9b9;font-size:12px;line-height:15px;text-align:center;}
  #ticker span{display:inline-block;padding-left:0;will-change:transform;}
  #timer{position:absolute;color:#d2d2d2;font:700 11px/15px monospace;
    text-align:center;overflow:hidden;white-space:nowrap;}
  .bar{position:absolute;cursor:pointer;}
  .bar img{position:absolute;left:0;top:0;}
  .bar .fill{position:absolute;left:0;top:0;overflow:hidden;height:100%;}
  .bar .fill img{position:absolute;left:0;top:0;}
  /* --- controls below the skin (not part of the skin) --- */
  #panel{margin:8px auto 20px;max-width:640px;padding:0 10px;
    font-size:13px;color:#999;}
  #panel select{max-width:100%;background:#111;color:#ddd;border:1px solid #333;
    padding:6px;font-size:14px;}
  #panel button{background:#1a1a1a;color:#ddd;border:1px solid #444;
    padding:6px 12px;margin:4px 2px;font-size:13px;cursor:pointer;}
  #panel button.on{background:#2c4a1e;border-color:#6a0;}
  #panel button.skinbtn{background:#1e2c1a;border-color:#5a0;}
  #status{margin-top:6px;font-size:12px;color:#777;min-height:16px;}
  #status .err{color:#e88;}
</style>
</head>
<body>
<h1><b id="skinname">BLAKK</b> — Amp v4 · main window only · <span id="skinsub">skin mặc định nạp trực tiếp từ blakk.zip, đổi skin bằng file .wal/.zip</span></h1>
<div id="viewport"><div id="scaler"></div></div>

<div id="panel">
  <select id="chan" title="Chọn kênh"></select><br>
  <button id="btn-fit">Vừa màn hình</button>
  <button id="btn-1x">Cỡ gốc 1x</button>
  <button id="btn-list">Danh sách kênh</button>
  <button id="btn-skin" class="skinbtn">Nạp skin (.wal/.zip)</button><br>
  <span style="font-size:12px;color:#666">Kéo thả file .wal/.zip vào player cũng được — nếu skin không đọc được thì giữ skin cũ.</span>
  <div id="status">Đang nạp blakk.zip + radio.m3u…</div>
  <input type="file" id="filepick" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac" hidden>
  <input type="file" id="skinpick" accept=".wal,.zip" hidden>
</div>

<audio id="au" preload="none"></audio>

<script>
"use strict";
/* v4: same renderer + playback as v3, but there are NO vendored libraries
   any more — JSZip and hls.js both come from CDN (see the <script> tags
   above). The default BLAKK skin is loaded from blakk.zip in this folder
   through the SAME SkinLoader.loadSkinFile() path as a user-picked
   .wal/.zip — one code path for every skin.
   Nothing here is hand-measured: x/y/w/h come from the skin XML. */
const $ = s => document.querySelector(s);
const scaler = $("#scaler"), viewport = $("#viewport"), statusEl = $("#status");
const au = $("#au");
let SKIN = null, channels = [], idx = 0, mode = "radio";
let hls = null, failCount = 0, failTimer = null, playing = false;
let scaleMode = localStorage.getItem("webamp-modern-scale") || "fit";
let tickerText = "Amp", tickerNoteUntil = 0, tickerTimer = null, fileName = "";

/* ---------- asset resolver: always from a loaded skin (blob URLs) ----------
   There is no built-in assets/ folder in the slim build: the default skin
   comes from blakk.zip via SkinLoader, exactly like a picked skin. The
   stub below only guards code that runs before any skin has loaded. */
const stubResolver = {
  hasCrop: () => false,
  bitmapURL: async () => null,
  fileURL: async () => null
};
let resolver = stubResolver;

function setStatus(msg, isErr){
  statusEl.innerHTML = isErr ? '<span class="err">'+msg+'</span>' : msg;
}
function fmt(t){ if(!isFinite(t)) return "--:--";
  t=Math.max(0,Math.floor(t)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); }
function setTimer(t){ const e = $("#timer"); if(e) e.textContent = t; }

/* ---------- scaling: follow the image, not a fixed template ---------- */
function applyScale(){
  const W = SKIN ? SKIN.layout.w : 436, H = SKIN ? SKIN.layout.h : 160;
  let s;
  if(scaleMode === "1x"){ s = 1; }
  else {
    const availH = Math.max(120, window.innerHeight - 130); // room for panel below
    s = Math.min(window.innerWidth*0.98/W, availH/H, 3);
  }
  scaler.style.transform = "scale("+s+")";
  scaler.style.width = W+"px"; scaler.style.height = H+"px";
  viewport.style.width = (W*s)+"px";
  viewport.style.height = (H*s)+"px";
  $("#btn-fit").classList.toggle("on", scaleMode==="fit");
  $("#btn-1x").classList.toggle("on", scaleMode==="1x");
}
function setScaleMode(m){
  scaleMode = m; localStorage.setItem("webamp-modern-scale", m); applyScale();
}
$("#btn-fit").onclick = ()=>setScaleMode("fit");
$("#btn-1x").onclick = ()=>setScaleMode("1x");
scaler.addEventListener("dblclick", ()=>setScaleMode(scaleMode==="fit"?"1x":"fit"));
window.addEventListener("resize", applyScale);

/* ---------- build the skin from a skin object + resolver ---------- */
async function resolveImg(imageId, imageFile){
  // Sprite-sheet bitmaps (ClassicPro style) must be cropped by id;
  // whole-file bitmaps resolve by zip path.
  if(imageId && resolver.hasCrop(imageId)){
    const u = await resolver.bitmapURL(imageId);
    if(u) return u;
  }
  if(imageFile) return await resolver.fileURL(imageFile);
  return null;
}
function imgElSrc(src, x, y, w, h){
  const im = document.createElement("img");
  im.src = src; im.draggable = false; im.alt = "";
  // A skin image that fails to load must vanish, never show a broken-image
  // icon + alt text over the skin (the D-Reliction bug).
  im.onerror = ()=>{ im.style.display = "none"; };
  im.style.left = x+"px"; im.style.top = y+"px";
  if(w) im.style.width = w+"px"; if(h) im.style.height = h+"px";
  return im;
}
async function buildSkin(){
  scaler.innerHTML = "";
  const L = SKIN.layout;
  // background (resolved through the same resolver as everything else)
  const bgSrc = L.backgroundFile ? await resolveImg(L.background, L.backgroundFile) : null;
  if(bgSrc){
    scaler.style.backgroundImage = "url("+JSON.stringify(bgSrc)+")";
    if(L.bgCrop){
      // Layout was cropped to the background's opaque box (Copperdeck):
      // show the full background image shifted so the opaque part aligns.
      scaler.style.backgroundSize = L.bgCrop.fullW+"px "+L.bgCrop.fullH+"px";
      scaler.style.backgroundPosition = (-L.bgCrop.x)+"px "+(-L.bgCrop.y)+"px";
    } else {
      scaler.style.backgroundSize = L.w+"px "+L.h+"px";
      scaler.style.backgroundPosition = "0 0";
    }
  } else {
    scaler.style.backgroundImage = "none";
  }
  const skip = new Set(["player.bb-seek-empty","player.bb-seek-full",
    "player.bb-volume-min","player.bb-volume-max",
    "player.bb-spectrum-left","player.bb-spectrum-right","player.bb-spectrum-on",
    "player.bb-songticker-endcover"]);
  for(const lay of SKIN.layers){
    if(skip.has(lay.image)) continue;
    const src = await resolveImg(lay.image, lay.imageFile);
    if(src) scaler.appendChild(imgElSrc(src, lay.x, lay.y, lay.w, lay.h));
  }
  // texts: songticker + timer (by id first, then by display/ticker attr)
  // Prefer the real songname ticker: some skins (DDTank) also have a
  // ticker="1" songinfo line, which is not the song name.
  const tick = SKIN.texts.find(t=>t.id && t.id.toLowerCase()==="songticker")
    || SKIN.texts.find(t=>t.display==="songname")
    || SKIN.texts.find(t=>t.ticker==="1");
  const tim = SKIN.texts.find(t=>t.id==="timer")
    || SKIN.texts.find(t=>t.display==="time");
  if(tick){
    const tickEl = document.createElement("div");
    tickEl.id = "ticker";
    tickEl.style.left = tick.x+"px"; tickEl.style.top = tick.y+"px";
    tickEl.style.width = tick.w+"px"; tickEl.style.height = (tick.h||14)+"px";
    tickEl.innerHTML = "<span id='tickerspan'></span>";
    scaler.appendChild(tickEl);
  }
  if(tim){
    const timEl = document.createElement("div");
    timEl.id = "timer";
    timEl.style.left = tim.x+"px"; timEl.style.top = tim.y+"px";
    timEl.style.width = tim.w+"px"; timEl.style.height = (tim.h||14)+"px";
    timEl.textContent = "--:--";
    scaler.appendChild(timEl);
  }
  const cover = SKIN.layers.find(l=>l.image==="player.bb-songticker-endcover");
  if(cover){
    const src = await resolveImg(cover.image, cover.imageFile);
    if(src) scaler.appendChild(imgElSrc(src, cover.x, cover.y, cover.w, cover.h));
  }
  await buildStrip();
  const spec = SKIN.spectrum;
  if(spec && spec.offFile){
    const src = await resolveImg(null, spec.offFile);
    if(src) scaler.appendChild(imgElSrc(src, spec.x, spec.y, spec.w, spec.h));
  }
  for(const b of SKIN.buttons) await buildButton(b);
  applyScale();
}
async function buildStrip(){
  const s = SKIN.seek, v = SKIN.volume;
  if(!s || !v) return; // skin without a seek/volume strip (e.g. ClassicPro)
  const d = document.createElement("div");
  d.className = "bar"; d.id = "strip";
  d.style.left = s.x+"px"; d.style.top = s.y+"px";
  d.style.width = s.w+"px"; d.style.height = s.h+"px";
  const sEmpty = await resolveImg(s.emptyImage, s.emptyFile);
  if(sEmpty) d.appendChild(imgElSrc(sEmpty, 0, 0, s.w, s.h));
  const fs = document.createElement("div");
  fs.className = "fill"; fs.id = "fill-seek"; fs.style.width = "0px";
  const sFull = await resolveImg(s.fullImage, s.fullFile);
  if(sFull) fs.appendChild(imgElSrc(sFull, 0, 0, s.w, s.h));
  d.appendChild(fs);
  const vEmpty = await resolveImg(v.emptyImage, v.emptyFile);
  if(vEmpty) d.appendChild(imgElSrc(vEmpty, v.x-s.x, v.y-s.y, v.w, v.h));
  const fv = document.createElement("div");
  fv.className = "fill"; fv.id = "fill-vol"; fv.style.width = "0px";
  fv.style.left = (v.x-s.x)+"px"; fv.style.top = (v.y-s.y)+"px";
  const vFull = await resolveImg(v.fullImage, v.fullFile);
  if(vFull) fv.appendChild(imgElSrc(vFull, 0, 0, v.w, v.h));
  d.appendChild(fv);
  d.addEventListener("pointerdown", e=>{ stripSet(e);
    const mv = ev=>stripSet(ev);
    const up = ()=>{ window.removeEventListener("pointermove", mv);
                     window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
  });
  scaler.appendChild(d);
}
function stripSet(e){
  const strip = $("#strip"); if(!strip) return;
  const el = strip.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (e.clientX-el.left)/el.width));
  if(mode==="file" && isFinite(au.duration) && au.duration>0){
    au.currentTime = frac*au.duration; setFill("seek", frac);
  } else {
    au.volume = frac; setFill("vol", frac);
    flashTicker("Âm lượng "+Math.round(frac*100)+"%");
  }
}
function setFill(kind, frac){
  if(!SKIN) return; // no skin loaded yet (e.g. default zip failed)
  const rect = kind==="seek" ? SKIN.seek : SKIN.volume;
  const el = $("#fill-"+kind);
  if(el && rect) el.style.width = Math.round(rect.w*frac)+"px";
}
async function buildButton(b){
  const d = document.createElement("div");
  d.className = "btn"; d.title = b.tooltip || b.id || b.action || "";
  d.style.left = b.x+"px"; d.style.top = b.y+"px";
  d.style.width = b.w+"px"; d.style.height = b.h+"px";
  b._src = await resolveImg(b.image, b.imageFile);
  b._hoverSrc = b.hoverImage ? await resolveImg(b.hoverImage, b.hoverFile) : null;
  b._downSrc = b.downImage ? await resolveImg(b.downImage, b.downFile) : null;
  // Merged Play/Pause button (DDTank): show the pause icon while playing.
  b._pauseSrc = b.pauseImage ? await resolveImg(b.pauseImage, b.pauseFile) : null;
  if(!b._src) return; // no image for this button: hide it entirely, never a
  // broken <img> with alt text over the skin (the D-Reliction bug: buttons
  // whose image is only set by a MAKI script have no image in the XML).
  const im = document.createElement("img");
  im.src = b._src; im.draggable = false; im.alt = "";
  im.onerror = ()=>{ d.style.display = "none"; };
  d.appendChild(im);
  const show = f => { if(f) im.src = f; };
  d.addEventListener("mouseenter", ()=>show(b._hoverSrc));
  d.addEventListener("mouseleave", ()=>show(b._src));
  d.addEventListener("mousedown", ()=>show(b._downSrc || b._hoverSrc));
  d.addEventListener("mouseup", ()=>show(b._hoverSrc || b._src));
  d.addEventListener("touchstart", ()=>show(b._downSrc || b._hoverSrc), {passive:true});
  d.addEventListener("touchend", ()=>show(b._src), {passive:true});
  d.addEventListener("click", ()=>onButton(b));
  scaler.appendChild(d);
  b._el = d; b._img = im;
}
function updatePlayState(){
  if(!SKIN) return; // no skin loaded yet (e.g. default zip failed)
  const play = SKIN.buttons.find(b=>b.action==="PLAY");
  if(play && play._img) play._img.src = playing ? (play._pauseSrc || play._downSrc || play._src) : play._src;
}

/* ---------- load a skin file directly (.wal/.zip) ---------- */
async function applySkinFile(file){
  if(!file) return;
  setStatus("Đang đọc skin: "+file.name+"…");
  try{
    if(typeof SkinLoader === "undefined") throw new Error("skin-loader.js chưa nạp được");
    const res = await SkinLoader.loadSkinFile(file);
    const prevSkin = SKIN, prevResolver = resolver;
    SKIN = res.skin; resolver = res.resolve;
    try { await buildSkin(); resetTicker(); renderTicker();
      setTimer(mode === "file" && isFinite(au.duration) && au.duration > 0 ? fmt(au.currentTime) : "LIVE"); }
    catch(e){ SKIN = prevSkin; resolver = prevResolver; await buildSkin(); throw e; }
    $("#skinname").textContent = SKIN.skin.name || file.name;
    $("#skinsub").textContent = "tác giả: " + (SKIN.skin.author || "?") + " · " + SKIN.buttons.length + " nút · " + SKIN.layout.w + "x" + SKIN.layout.h;
    setStatus("Đã nạp skin: " + (SKIN.skin.name || file.name) + " — " + (SKIN.skin.author || ""));
    window.__lastSkinLoad = { ok: true, name: SKIN.skin.name, author: SKIN.skin.author,
      file: file.name, buttons: SKIN.buttons.length, layout: SKIN.layout,
      missing: res.report.missing, notes: res.report.notes };
  }catch(err){
    window.__lastSkinLoad = { ok: false, file: file.name, error: err.message };
    // Loader errors go ONLY to the status line below the player — never
    // into the ticker inside the skin (v3 bug, see resetTicker above).
    setStatus("không đọc được skin này: " + err.message, true);
  }
}
$("#btn-skin").onclick = ()=>$("#skinpick").click();
$("#skinpick").addEventListener("change", e=>{
  applySkinFile(e.target.files[0]);
  e.target.value = ""; // allow picking the same file again
});
viewport.addEventListener("dragover", e=>{ e.preventDefault(); viewport.classList.add("dragover"); });
viewport.addEventListener("dragleave", ()=>viewport.classList.remove("dragover"));
viewport.addEventListener("drop", e=>{
  e.preventDefault(); viewport.classList.remove("dragover");
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) applySkinFile(f);
});

/* ---------- ticker: only song/channel names and volume go here ----------
   Loader errors and "not implemented yet" notices NEVER go into the ticker:
   they belong in the status line below the player. (v3 flashed the loader
   error into the ticker, and a successful load never cleared it — so Act 3
   Scene 1 and D-Reliction showed the previous failed skin's error text
   over the new skin.) */
function resetTicker(){
  tickerText = mode === "file" ? (fileName || "File local")
    : (channels[idx] ? channels[idx].name + " — Trực tiếp" : "Amp");
  tickerNoteUntil = 0;
}
function flashTicker(msg, ms){
  tickerText = msg; tickerNoteUntil = Date.now() + (ms||2500);
  renderTicker();
}
function renderTicker(){
  const span = $("#tickerspan"); if(!span) return;
  span.textContent = tickerText;
  span.dataset.x = "0";
  span.style.transform = "translateX(0px)";
}
function tickTicker(){
  const span = $("#tickerspan"); if(!span) return;
  const box = $("#ticker");
  if(!box) return;
  if(span.scrollWidth <= box.clientWidth || Date.now() < tickerNoteUntil){ return; }
  let x = parseFloat(span.dataset.x || "0") - 1;
  if(-x > span.scrollWidth) x = box.clientWidth;
  span.dataset.x = x; span.style.transform = "translateX("+x+"px)";
}
setInterval(tickTicker, 40);

/* ---------- playlist (radio.m3u) ---------- */
function parseM3U(text){
  const lines = text.split(/\r?\n/); const out = [];
  for(let i=0;i<lines.length;i++){
    const m = lines[i].match(/^#EXTINF:-?\d+,(.*)$/);
    if(m){
      const url = (lines[i+1]||"").trim();
      if(url && !url.startsWith("#")) out.push({name:m[1].trim(), url});
    }
  }
  return out;
}
function fillChannelSelect(){
  const sel = $("#chan"); sel.innerHTML = "";
  channels.forEach((c,i)=>{
    const o = document.createElement("option");
    o.value = i; o.textContent = (i+1)+". "+c.name; sel.appendChild(o);
  });
  sel.value = idx;
  sel.onchange = ()=>loadChannel(+sel.value, true);
}
$("#btn-list").onclick = ()=>{ const s=$("#chan"); s.focus(); s.size = s.size?0:8; };

/* ---------- playback ---------- */
function destroyHls(){ if(hls){ try{hls.destroy();}catch(e){} hls = null; } }
function loadChannel(i, autoplay){
  if(!channels.length) return;
  idx = ((i%channels.length)+channels.length)%channels.length;
  mode = "radio"; failCount = 0;
  const c = channels[idx];
  $("#chan").value = idx;
  tickerText = c.name+" — Trực tiếp"; tickerNoteUntil = 0; renderTicker();
  setTimer("LIVE"); setFill("seek", 0);
  setStatus("Kênh "+(idx+1)+"/"+channels.length+": "+c.name);
  destroyHls(); au.pause();
  const url = c.url;
  const playIt = ()=>{ if(autoplay) au.play().catch(()=>{ /* gesture needed */ }); };
  if(/\.m3u8($|\?)/i.test(url) && window.Hls && Hls.isSupported()){
    hls = new Hls({maxBufferLength:30});
    hls.loadSource(url); hls.attachMedia(au);
    hls.on(Hls.Events.ERROR, (ev,data)=>{
      if(data && data.fatal) handleFail("HLS "+(data.type||"")+" "+(data.details||""));
    });
    hls.on(Hls.Events.MANIFEST_PARSED, playIt);
    setTimeout(()=>{ if(au.paused && autoplay && !au.src) playIt(); }, 3000);
  } else {
    au.src = url; playIt();
  }
}
function handleFail(why){
  failCount++;
  const c = channels[idx];
  const msg = c.name+" — không phát được"+(why?" ("+why+")":"");
  // Ticker shows only the short form; the full reason goes to the status
  // line below the player, so a long error never scrolls over the skin.
  tickerText = c.name+" — không phát được"; tickerNoteUntil = Date.now()+2500; renderTicker();
  setStatus(msg, true);
  if(failCount >= 6){ setStatus("Nhiều kênh lỗi liên tiếp — đã dừng tự chuyển. Bấm Next để thử kênh khác.", true); return; }
  clearTimeout(failTimer);
  failTimer = setTimeout(()=>loadChannel(idx+1, true), 2500);
}
au.addEventListener("playing", ()=>{ playing = true; updatePlayState(); });
au.addEventListener("pause", ()=>{ playing = false; updatePlayState(); });
au.addEventListener("error", ()=>{
  if(!au.src || au.src==="") return;
  if(mode==="file"){ setStatus("File lỗi — không phát được", true); return; }
  handleFail("audio error");
});
au.addEventListener("timeupdate", ()=>{
  if(mode==="file" && isFinite(au.duration) && au.duration>0){
    setTimer(fmt(au.currentTime));
    setFill("seek", au.currentTime/au.duration);
  } else {
    setTimer("LIVE");
  }
});
au.addEventListener("ended", ()=>{ if(mode==="file"){ playing=false; updatePlayState(); } });

function onButton(b){
  const a = b.action, p = b.param;
  // Merged Play/Pause button (DDTank): tap toggles, like Winamp's MAKI.
  if(a==="PLAY" && b.mergedPause && playing){ au.pause(); return; }
  if(a==="PLAY"){ if(mode==="file" && au.src){ au.play(); } else loadChannel(idx, true); }
  else if(a==="PAUSE"){ au.pause(); }
  else if(a==="STOP"){ au.pause(); try{ au.currentTime=0; }catch(e){}
    if(mode==="file"){ setFill("seek",0); setTimer("0:00"); } }
  else if(a==="NEXT"){ loadChannel(idx+1, true); }
  else if(a==="PREV"){ loadChannel(idx-1, true); }
  else if(a==="EJECT"){ $("#filepick").click(); }
  else if(a==="CLOSE"){ setStatus("Nút đóng chưa có tác dụng trong bản này"); }
  else if(a==="MINIMIZE"){ setStatus("Nút thu nhỏ chưa có tác dụng trong bản này"); }
  else if(a==="SYSMENU"){ $("#chan").focus(); setStatus("Menu: dùng danh sách kênh bên dưới"); }
  else if(a==="TOGGLE"){
    if(p==="eq") setStatus("EQ chưa có trong bản này");
    else if(p && p.indexOf("PL")>=0) setStatus("Playlist chưa có trong bản này");
    else if(p && p.indexOf("ML")>=0) setStatus("Media Library chưa có trong bản này");
    else setStatus("Nút này chưa có tác dụng trong bản này");
  }
  else if(!a){ setStatus("Nút chuyển chế độ chưa có tác dụng trong bản này"); }
}
$("#filepick").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  destroyHls(); mode = "file"; failCount = 0; fileName = f.name;
  au.src = URL.createObjectURL(f);
  tickerText = f.name; tickerNoteUntil = 0; renderTicker();
  setTimer("0:00"); setFill("seek", 0);
  setStatus("File local: "+f.name);
  au.play().catch(()=>{});
});

/* ---------- boot: default skin = blakk.zip, same loader as a picked skin ----------
   radio.m3u loads independently so the channel list works even if the
   default skin fails; in that case the page shows the message below and
   the “Nạp skin” button stays usable — never a dead end. */
async function loadDefaultSkin(){
  try{
    if(typeof SkinLoader === "undefined") throw new Error("skin-loader.js chưa nạp được");
    const r = await fetch("blakk.zip");
    if(!r.ok) throw new Error("blakk.zip HTTP "+r.status);
    const blob = await r.blob();
    await applySkinFile(new File([blob], "blakk.zip", {type: "application/zip"}));
    if(window.__lastSkinLoad && window.__lastSkinLoad.ok === false)
      throw new Error(window.__lastSkinLoad.error || "không đọc được blakk.zip");
    return true;
  }catch(err){
    window.__lastSkinLoad = { ok: false, file: "blakk.zip", error: err.message };
    setStatus("không nạp được skin mặc định ("+err.message+"), bấm Nạp skin để chọn file .wal/.zip", true);
    return false;
  }
}
fetch("radio.m3u").then(r=>{ if(!r.ok) throw new Error("radio.m3u HTTP "+r.status); return r.text(); })
.then(async (m3u)=>{
  channels = parseM3U(m3u);
  fillChannelSelect();
  au.volume = 1.0; setFill("vol", 1.0);
  loadChannel(0, false);
  const ok = await loadDefaultSkin();
  if(ok){
    tickerText = channels[0] ? channels[0].name+" — Trực tiếp" : "BLAKK";
    renderTicker();
    let msg = "Đã nạp "+channels.length+" kênh từ radio.m3u · bấm Play để nghe · bấm đúp vào player để đổi 1x / vừa màn hình · bấm “Nạp skin” để thử file .wal/.zip";
    if(!window.Hls) msg += " · cảnh báo: thư viện hls.js chưa tải được từ mạng (CDN), đài .m3u8 có thể không phát được — kiểm tra mạng rồi tải lại trang";
    setStatus(msg);
  }
}).catch(err=>{
  setStatus("Lỗi nạp radio.m3u: "+err.message, true);
  console.error(err);
});
</script>
